name: Phase observation qualification
run-name: Phase observation qualification
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Published benchmark mode
        type: choice
        options: [measure, fixtures]
        default: measure
      rss_diagnostic:
        description: Run startup RSS controls only; no qualification verdict
        type: boolean
        default: false
      fixture_filter:
        description: Optional diagnostic fixture filter; never applies to measurements
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: phase-observation-qualification
  cancel-in-progress: false
env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: static
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"
  NX_DAEMON: "false"
  NX_PARALLEL: "2"
  NX_SKIP_REMOTE_CACHE: "true"
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned workspace toolchain
        uses: ./.github/actions/setup-workspace
      - name: Build and preserve exact clean subjects
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="$RUNNER_TEMP/phase-qualification"
          mkdir -p "$qualification_root/baseline" "$qualification_root/candidate"
          git worktree add --detach "$RUNNER_TEMP/phase-baseline" 8ef89852780b4274ac7f4694528791bc805ae60c
          (
            cd "$RUNNER_TEMP/phase-baseline"
            pnpm install --frozen-lockfile
            test -z "$(git status --porcelain)"
            pnpm exec nx run cli:compile-host
            test -z "$(git status --porcelain)"
            cp apps/cli/dist/host-bin/axm-linux-x64 "$qualification_root/baseline/axm-linux-x64"
          )
          git rev-parse HEAD > "$qualification_root/harness-revision.txt"
          git worktree add --detach "$RUNNER_TEMP/phase-candidate" c2c1ba03afc94602e475462c99643d42b3e45a57
          (
            cd "$RUNNER_TEMP/phase-candidate"
            pnpm install --frozen-lockfile
            test -z "$(git status --porcelain)"
            pnpm exec nx run cli:compile-host
            test -z "$(git status --porcelain)"
            cp apps/cli/dist/host-bin/axm-linux-x64 "$qualification_root/candidate/axm-linux-x64"
          )
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'phase-qualification'
          for subject,revision in [('baseline','8ef89852780b4274ac7f4694528791bc805ae60c'),('candidate','c2c1ba03afc94602e475462c99643d42b3e45a57')]:
              binary=root/subject/'axm-linux-x64'
              manifest={'binaryPath':str(binary),'binarySha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'sourceRevision':revision,'sourceDirty':False}
              (root/subject/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Start the isolated receiver and network fixture service
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="$RUNNER_TEMP/phase-qualification"
          pnpm run seq:start
          pnpm run seq:status > "$qualification_root/receiver-before.log"
          pnpm run registry:network:serve > "$qualification_root/toxiproxy.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8474/version > "$qualification_root/toxiproxy-version.json"; then
              break
            fi
            sleep 1
          done
          test -s "$qualification_root/toxiproxy-version.json"
          df -h > "$qualification_root/disk-before.txt"
          docker compose -f tools/seq/compose.yaml ps --format json > "$qualification_root/receiver-container.json"
          ps -eo pid,ppid,comm,pcpu,pmem > "$qualification_root/processes-before.txt"
      - name: Run the published benchmark mode
        if: ${{ !inputs.rss_diagnostic }}
        timeout-minutes: 315
        shell: bash
        env:
          AXM_BENCHMARK_SUITE: observability
          AXM_OBSERVABILITY_RUN: ${{ inputs.run_mode }}
          AXM_OBSERVABILITY_SCENARIO_FILTER: ${{ inputs.fixture_filter }}
          AXM_OBSERVABILITY_REFERENCE_HOST: "1"
        run: |
          set -euo pipefail
          if [[ "$AXM_OBSERVABILITY_RUN" == measure ]]; then
            test -z "$AXM_OBSERVABILITY_SCENARIO_FILTER"
            unset AXM_OBSERVABILITY_SCENARIO_FILTER
          fi
          export AXM_OBSERVABILITY_BASELINE_MANIFEST="$RUNNER_TEMP/phase-qualification/baseline/manifest.json"
          export AXM_OBSERVABILITY_CANDIDATE_MANIFEST="$RUNNER_TEMP/phase-qualification/candidate/manifest.json"
          export AXM_OBSERVABILITY_OUTPUT="$RUNNER_TEMP/phase-qualification/campaign"
          pnpm run bench 2>&1 | tee "$RUNNER_TEMP/phase-qualification/campaign.log"
      - name: Diagnose startup RSS with identical-binary controls
        if: ${{ inputs.rss_diagnostic }}
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, os, subprocess, time, json, hashlib, statistics
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'phase-qualification'
          out=root/'rss-diagnostic';out.mkdir()
          home=out/'home';home.mkdir()
          workspace=out/'workspace';workspace.mkdir()
          env={k:v for k,v in os.environ.items() if k in ['PATH','LD_LIBRARY_PATH']}
          env.update(HOME=str(home),AXM_USER_HOME=str(home),XDG_CACHE_HOME=str(home/'cache'),AXM_NO_UPDATE_CHECK='1',AXM_TELEMETRY='0',CI='1',NO_COLOR='1',GIT_CONFIG_NOSYSTEM='1',GIT_TERMINAL_PROMPT='0',LANG='C.UTF-8',LC_ALL='C.UTF-8',TZ='UTC')
          rows=[]
          for control in [True,False]:
           for block in range(30):
            order=['baseline','candidate'] if block%2==0 else ['candidate','baseline']
            pair=[]
            for label in order:
             subject='baseline' if control else label
             prefix=out/('%s-%s-%s' % ('identical' if control else 'comparison',block,label))
             rss=prefix.with_suffix('.rss');started=time.monotonic()
             result=subprocess.run(['/usr/bin/time','-f','%M','-o',str(rss),str(root/subject/'axm-linux-x64'),'--help','--json','--non-interactive'],cwd=workspace,env=env,capture_output=True)
             prefix.with_suffix('.stdout').write_bytes(result.stdout)
             prefix.with_suffix('.stderr').write_bytes(result.stderr)
             assert result.returncode==0,(control,block,label,result.stderr.decode())
             assert json.loads(result.stdout)['type']=='help'
             row=dict(control=control,block=block,label=label,subject=subject,order=order.index(label),elapsedMs=(time.monotonic()-started)*1000,peakRssBytes=int(rss.read_text())*1024,stdoutSha256=hashlib.sha256(result.stdout).hexdigest())
             pair.append(row);rows.append(row)
             with (out/'samples.jsonl').open('a') as f:f.write(json.dumps(row)+'\n')
            assert pair[0]['stdoutSha256']==pair[1]['stdoutSha256']
          summary={}
          for control in [True,False]:
           selected=[r for r in rows if r['control']==control]
           deltas=[]
           for block in range(30):
            pair={r['label']:r for r in selected if r['block']==block}
            deltas.append(pair['candidate']['peakRssBytes']-pair['baseline']['peakRssBytes'])
           summary['identical' if control else 'comparison']=dict(pairedRssDeltas=deltas,over16MiB=sum(d>16777216 for d in deltas),subjects={label:dict(min=min(v),median=statistics.median(v),max=max(v)) for label in ['baseline','candidate'] for v in [[r['peakRssBytes'] for r in selected if r['label']==label]]})
          summary['limitation']='Isolated-host diagnostic only; original qualification failure and16MiB threshold retained. No qualification verdict is produced.'
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Retain receiver and host health after collection
        if: always()
        shell: bash
        run: |
          qualification_root="$RUNNER_TEMP/phase-qualification"
          mkdir -p "$qualification_root"
          pnpm run seq:status > "$qualification_root/receiver-after.log" 2>&1 || true
          docker compose -f tools/seq/compose.yaml logs --no-color --tail 200 > "$qualification_root/receiver.log" 2>&1 || true
          df -h > "$qualification_root/disk-after.txt"
          ps -eo pid,ppid,comm,pcpu,pmem > "$qualification_root/processes-after.txt"
      - name: Preserve complete and failed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase-observation-qualification
          path: ${{ runner.temp }}/phase-qualification
          include-hidden-files: true
          retention-days: 14
