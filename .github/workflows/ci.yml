name: Setup CPU profile diagnosis
run-name: Setup CPU profile diagnosis
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Published benchmark mode
        type: choice
        options: [measure, fixtures]
        default: measure
      fixture_filter:
        description: Optional diagnostic fixture filter; never applies to measurements
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: phase-observation-setup-profile
  cancel-in-progress: false
env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: static
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"
  NX_DAEMON: "false"
  NX_PARALLEL: "2"
  NX_SKIP_REMOTE_CACHE: "true"
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned workspace toolchain
        uses: ./.github/actions/setup-workspace
      - name: Build and preserve exact clean subjects
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="$RUNNER_TEMP/phase-qualification"
          mkdir -p "$qualification_root/baseline" "$qualification_root/candidate"
          git worktree add --detach "$RUNNER_TEMP/phase-baseline" 58d4c311b9ce437a2642d11c0edd8a765cc87acc
          (
            cd "$RUNNER_TEMP/phase-baseline"
            pnpm install --frozen-lockfile
            test -z "$(git status --porcelain)"
            pnpm exec nx run cli:compile-host
            test -z "$(git status --porcelain)"
            cp apps/cli/dist/host-bin/axm-linux-x64 "$qualification_root/baseline/axm-linux-x64"
          )
          git rev-parse HEAD > "$qualification_root/harness-revision.txt"
          git worktree add --detach "$RUNNER_TEMP/phase-candidate" b2b543e5eeacd8d99cfff9de68703c4f7bd94d54
          (
            cd "$RUNNER_TEMP/phase-candidate"
            pnpm install --frozen-lockfile
            test -z "$(git status --porcelain)"
            pnpm exec nx run cli:compile-host
            test -z "$(git status --porcelain)"
            cp apps/cli/dist/host-bin/axm-linux-x64 "$qualification_root/candidate/axm-linux-x64"
          )
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'phase-qualification'
          for subject,revision in [('baseline','58d4c311b9ce437a2642d11c0edd8a765cc87acc'),('candidate','b2b543e5eeacd8d99cfff9de68703c4f7bd94d54')]:
              binary=root/subject/'axm-linux-x64'
              manifest={'binaryPath':str(binary),'binarySha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'sourceRevision':revision,'sourceDirty':False}
              (root/subject/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Start the isolated receiver and network fixture service
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="$RUNNER_TEMP/phase-qualification"
          pnpm run seq:start
          pnpm run seq:status > "$qualification_root/receiver-before.log"
          pnpm run registry:network:serve > "$qualification_root/toxiproxy.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8474/version > "$qualification_root/toxiproxy-version.json"; then
              break
            fi
            sleep 1
          done
          test -s "$qualification_root/toxiproxy-version.json"
          df -h > "$qualification_root/disk-before.txt"
          docker compose -f tools/seq/compose.yaml ps --format json > "$qualification_root/receiver-container.json"
          ps -eo pid,ppid,comm,pcpu,pmem > "$qualification_root/processes-before.txt"
      - name: Profile exact compiled setup subjects
        shell: bash
        run: |
          python3 - <<'PYPROFILE'
          import pathlib,os,subprocess,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'phase-qualification'
          out=root/'cpu-profiles';out.mkdir()
          rows=[]
          for iteration in range(3):
            for subject,mode in [('baseline','disabled'),('candidate','disabled'),('candidate','summary'),('candidate','detail')]:
              target=out/(str(iteration)+'-'+subject+'-'+mode);target.mkdir()
              workspace=target/'workspace';home=target/'home';workspace.mkdir();home.mkdir()
              binary=root/subject/'axm-linux-x64'
              env={k:v for k,v in os.environ.items() if k in ['PATH','LD_LIBRARY_PATH']}
              env.update(HOME=str(home),AXM_USER_HOME=str(home),XDG_CACHE_HOME=str(home/'cache'),AXM_NO_UPDATE_CHECK='1',AXM_TELEMETRY='0',CI='1',NO_COLOR='1',GIT_CONFIG_NOSYSTEM='1',GIT_TERMINAL_PROMPT='0',LANG='C.UTF-8',LC_ALL='C.UTF-8',TZ='UTC',AXM_TRACE='off' if mode=='disabled' else '1',AXM_TRACE_DETAIL='io' if mode=='detail' else '',AXM_TRACE_RECEIPT=str(target/'receipt.json'),BUN_OPTIONS='--cpu-prof --cpu-prof-md --cpu-prof-interval=100 --cpu-prof-dir='+str(target))
              with (target/'stdout').open('wb') as stdout,(target/'stderr').open('wb') as stderr:
                result=subprocess.run([str(binary),'setup','--yes','--scope','project','--agent','claude-code','--json','--non-interactive'],cwd=workspace,env=env,stdout=stdout,stderr=stderr)
              row=dict(iteration=iteration,subject=subject,mode=mode,exit=result.returncode,binarySha256=hashlib.sha256(binary.read_bytes()).hexdigest())
              rows.append(row)
              (out/'runs.json').write_text(json.dumps(dict(runs=rows,limitation='CPU profiling diagnostics only, with profiler overhead. No qualification verdict or elapsed-budget claim.'),indent=2)+'\n')
              assert result.returncode==0,row
              assert list(target.glob('*.cpuprofile')),row
          PYPROFILE
      - name: Retain receiver and host health after collection
        if: always()
        shell: bash
        run: |
          qualification_root="$RUNNER_TEMP/phase-qualification"
          mkdir -p "$qualification_root"
          pnpm run seq:status > "$qualification_root/receiver-after.log" 2>&1 || true
          docker compose -f tools/seq/compose.yaml logs --no-color --tail 200 > "$qualification_root/receiver.log" 2>&1 || true
          df -h > "$qualification_root/disk-after.txt"
          ps -eo pid,ppid,comm,pcpu,pmem > "$qualification_root/processes-after.txt"
      - name: Preserve complete and failed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase-observation-qualification
          path: ${{ runner.temp }}/phase-qualification
          include-hidden-files: true
          retention-days: 14
