# yaml-language-server: $schema=../../agent.schema.json
id: codebuddy
name: CodeBuddy
vendor: Tencent Cloud
homepage: https://www.codebuddy.ai
interfaces:
  - cli
  - ide-extension
docs:
  - label: CodeBuddy documentation
    url: https://www.codebuddy.ai/docs/ide/Introduction
subagents:
  support: bridged
  scopes:
    - user
    - project
  sources:
    - https://staging-codebuddy.tencent.com/docs/cli/best-practices
  lastVerified: 2026-05-20
  directory: .codebuddy/agents
  layout: directory
permissions:
  support: standard
  scopes:
    - user
    - project
  mechanism:
    - cli-flag
  cliFlags:
    - flag: --dangerously-skip-permissions
      note: Bypasses CodeBuddy Code permission prompts.
  sources:
    - https://staging-codebuddy.tencent.com/docs/cli/reference
  lastVerified: 2026-05-20
rootDir: .codebuddy
skills:
  support: standard
  scopes:
    - user
    - project
  sources:
    - https://www.codebuddy.ai/docs/ide/Introduction
  lastVerified: 2026-05-20
  directory: .codebuddy/skills
