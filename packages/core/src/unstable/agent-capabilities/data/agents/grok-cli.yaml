# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: grok-cli
name: Grok CLI
vendor: xAI
homepage: https://x.ai/cli
interfaces:
  - cli
family: xai
docs:
  - label: Grok CLI documentation
    url: https://docs.x.ai/build/overview
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .grok/skills
  notes: >
    Reads SKILL.md Agent Skills from project (.grok/skills) and user (~/.grok/skills,
    ~/.agents/skills) locations, plus additional paths configured via [skills] in
    ~/.grok/config.toml.
  sources:
    - https://docs.x.ai/build/features/skills-plugins-marketplaces
  lastVerified: 2026-05-19
mcp:
  standardsCompliance: partial
  convention: vendor
  scopes:
    - user
    - project
  transports:
    - stdio
    - http
    - sse
  notes: >
    MCP servers are managed with `grok mcp add/remove/list` or under the mcpServers key in
    .grok/settings.json. The prescriptive config dialect has not been verified against xAI docs.
  sources:
    - https://docs.x.ai/build/modes-and-commands
  lastVerified: 2026-05-19
instructions:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  files:
    - AGENTS.md
  nestedDiscovery: true
  notes: >
    AGENTS.md files are merged from the git root down to the working directory, with
    AGENTS.override.md taking precedence per directory.
  sources:
    - https://docs.x.ai/build/overview
  lastVerified: 2026-05-19
  kind: agents-md
rootDir: .grok
