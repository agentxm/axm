# yaml-language-server: $schema=../../agent.schema.json
id: hermes
name: Hermes Agent
vendor: Nous Research
homepage: https://hermes-agent.nousresearch.com
interfaces:
  - cli
docs:
  - label: Hermes Agent documentation
    url: https://hermes-agent.nousresearch.com/docs
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
  directory: .hermes/skills
  notes: >
    Hermes reads SKILL.md skills from ~/.hermes/skills as the source of truth. Additional external
    skill directories can be configured in ~/.hermes/config.yaml for shared team use.
  sources:
    - https://hermes-agent.nousresearch.com/docs/user-guide/features/skills
  lastVerified: 2026-05-20
mcp:
  standardsCompliance: partial
  convention: vendor
  scopes:
    - user
  transports:
    - stdio
    - http
  notes: >
    Hermes declares MCP servers under mcp_servers in ~/.hermes/config.yaml. The YAML config dialect
    is outside AXM's current native MCP writer formats.
  sources:
    - https://hermes-agent.nousresearch.com/docs/user-guide/features/mcp
  lastVerified: 2026-05-20
instructions:
  standardsCompliance: full
  convention: universal
  scopes:
    - project
  files:
    - AGENTS.md
  nestedDiscovery: true
  notes: >
    Hermes reads AGENTS.md as a recursive project instruction source. .hermes.md or HERMES.md are
    higher-priority native alternatives at the git root, but AGENTS.md is the cross-tool standard
    AXM writes.
  sources:
    - https://hermes-agent.nousresearch.com/docs/user-guide/configuration
  lastVerified: 2026-05-20
  kind: agents-md
rootDir: .hermes
