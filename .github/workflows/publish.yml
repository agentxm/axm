name: Release
run-name: >-
  ${{
    github.run_attempt > 1 &&
    format('Release - {0} - rerun {1}', inputs.release_tag || inputs.source_sha || github.event.workflow_run.head_sha, github.run_attempt) ||
    format('Release - {0}', inputs.release_tag || inputs.source_sha || github.event.workflow_run.head_sha)
  }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Resume a stable release or publish the explicit bootstrap prerelease
        required: true
        default: stable-recovery
        type: choice
        options:
          - stable-recovery
          - bootstrap-prerelease
      release_tag:
        description: Existing stable tag to resume; required for stable-recovery
        required: false
        type: string
      source_sha:
        description: Exact current main commit; required for bootstrap-prerelease
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: "static"
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"

concurrency:
  group: canonical-release-publication
  cancel-in-progress: false

jobs:
  source:
    name: Resolve publication authority
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      mode: ${{ steps.source.outputs.mode }}
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      tooling_sha: ${{ steps.source.outputs.tooling_sha }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
    steps:
      - name: Checkout declared source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.mode == 'bootstrap-prerelease' && inputs.source_sha || 'main' }}

      - name: Resolve exact publication source
        id: source
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          eligible=false
          mode="${REQUESTED_MODE:-stable-auto}"
          tag=""
          sha="$(git rev-parse HEAD)"
          tooling_sha="$sha"
          ci_run_id=""

          if [[ "$EVENT_NAME" == workflow_run ]]; then
            if [[ "$CI_CONCLUSION" != success || "$CI_EVENT" != push || "$CI_HEAD_BRANCH" != main ]]; then
              printf 'eligible=false\nmode=stable-auto\ntag=\nsha=%s\ntooling_sha=%s\nci_run_id=\n' \
                "$sha" "$tooling_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$sha" != "$CI_HEAD_SHA" ]]; then
              echo "Workflow-run checkout differs from the completed CI revision."
              exit 1
            fi
            subject="$(git show -s --format=%s HEAD)"
            if [[ "$subject" != "release: cli-v"* ]]; then
              printf 'eligible=false\nmode=stable-auto\ntag=\nsha=%s\ntooling_sha=%s\nci_run_id=\n' \
                "$sha" "$tooling_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$subject" =~ ^release:\ (cli-v[^[:space:]]+)(\ \(\#[0-9]+\))?$ ]]; then
              tag="${BASH_REMATCH[1]}"
            else
              echo "Release-like commit has a noncanonical subject: $subject"
              exit 1
            fi
            ci_run_id="$CI_RUN_ID"
            eligible=true
          elif [[ "$mode" == stable-recovery ]]; then
            if [[ -z "$RELEASE_TAG" ]]; then
              echo "stable-recovery requires release_tag."
              exit 1
            fi
            tag="$RELEASE_TAG"
            git fetch origin main --no-tags
            matches=()
            while IFS=$'\t' read -r commit subject; do
              if [[ "$subject" =~ ^release:\ (cli-v[^[:space:]]+)(\ \(\#[0-9]+\))?$ ]] &&
                [[ "${BASH_REMATCH[1]}" == "$tag" ]]; then
                matches+=("$commit")
              fi
            done < <(git log origin/main --format='%H%x09%s')
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one canonical release commit for $tag on origin/main."
              exit 1
            fi
            sha="${matches[0]}"
            git checkout --detach "$sha"
            eligible=true
          elif [[ "$mode" == bootstrap-prerelease ]]; then
            if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$sha" != "$SOURCE_SHA" ]]; then
              echo "bootstrap-prerelease requires the exact checked-out source_sha."
              exit 1
            fi
            git fetch origin main --no-tags
            if [[ "$(git rev-parse origin/main)" != "$sha" ]]; then
              echo "Bootstrap prereleases may be published only from current main."
              exit 1
            fi
            eligible=true
          else
            echo "Unknown publication mode: $mode"
            exit 1
          fi

          if [[ -n "$tag" ]]; then
            version="${tag#cli-v}"
            manifest_version="$(jq -r '.version' apps/cli/package.json)"
            if [[ "$manifest_version" != "$version" ]]; then
              echo "Release tag $tag differs from package version $manifest_version."
              exit 1
            fi
          fi
          printf 'eligible=%s\nmode=%s\ntag=%s\nsha=%s\ntooling_sha=%s\nci_run_id=%s\n' \
            "$eligible" "$mode" "$tag" "$sha" "$tooling_sha" "$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Report publication selection
        if: always()
        env:
          ELIGIBLE: ${{ steps.source.outputs.eligible }}
          MODE: ${{ steps.source.outputs.mode }}
          TAG: ${{ steps.source.outputs.tag }}
          SHA: ${{ steps.source.outputs.sha }}
          TOOLING_SHA: ${{ steps.source.outputs.tooling_sha }}
          CI_RUN_ID: ${{ steps.source.outputs.ci_run_id }}
        run: |
          {
            echo "## Publication selection"
            echo "- Eligible: ${ELIGIBLE:-unresolved}"
            echo "- Mode: ${MODE:-unresolved}"
            echo "- Tag: ${TAG:-none}"
            echo "- Commit: ${SHA:-unresolved}"
            echo "- Tooling commit: ${TOOLING_SHA:-unresolved}"
            echo "- Exact CI run: ${CI_RUN_ID:-resolved by recovery preflight}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish Release Assets
    needs: source
    if: needs.source.outputs.eligible == 'true' && needs.source.outputs.mode != 'bootstrap-prerelease'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      version: ${{ steps.release_meta.outputs.version }}
      sha: ${{ steps.release_meta.outputs.sha }}
      outcome: ${{ steps.distribution.outputs.outcome || steps.distribution_preflight.outputs.outcome }}
      publication: ${{ steps.distribution.outputs.publication }}
      github_release: ${{ steps.publish_release.outputs.outcome || steps.prepare_release.outputs.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.tooling_sha }}

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      # npm is not a mise.toml tool; the release job needs a newer npm than the
      # one bundled with Node for `npm publish --provenance`.
      - name: Set up npm 11.5.1
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Resolve release tag and commit
        id: release_meta
        run: >-
          pnpm exec nx run axm:resolve-release-meta --outputStyle=static --
          "${{ needs.source.outputs.tag }}" "${{ needs.source.outputs.sha }}"

      - name: Download release binaries from CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.source.outputs.ci_run_id }}
        run: |
          args=("${{ steps.release_meta.outputs.sha }}" release-assets release-npm)
          if [[ -n "$CI_RUN_ID" ]]; then
            args+=("$CI_RUN_ID")
          fi
          pnpm exec nx run axm:download-ci-binaries --outputStyle=static -- "${args[@]}"

      - name: Generate release checksums
        run: pnpm exec nx run axm:generate-release-checksums --outputStyle=static -- release-assets

      - name: Validate release asset set
        run: pnpm exec nx run axm:validate-release-assets --outputStyle=static -- release-assets

      - name: Validate exact npm cohort
        run: >-
          pnpm exec nx run axm:validate-release-cohort --outputStyle=static --
          release-npm "${{ steps.release_meta.outputs.version }}"
          "${{ steps.release_meta.outputs.sha }}"

      - name: Preflight mutable distribution owners
        id: distribution_preflight
        run: >-
          pnpm exec nx run axm:distribute-release --outputStyle=static --
          "${{ steps.release_meta.outputs.version }}"
          "${{ steps.release_meta.outputs.tag }}"
          release-assets release-npm "${{ steps.release_meta.outputs.sha }}" --preflight

      - name: Prepare exact draft GitHub Release
        id: prepare_release
        if: steps.distribution_preflight.outputs.outcome == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pnpm exec nx run axm:reconcile-github-release --outputStyle=static --
          prepare "${{ steps.release_meta.outputs.tag }}"
          "${{ steps.release_meta.outputs.sha }}"

      - name: Publish verified immutable distribution
        id: distribution
        if: steps.distribution_preflight.outputs.outcome == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: >-
          pnpm exec nx run axm:distribute-release --outputStyle=static --
          "${{ steps.release_meta.outputs.version }}"
          "${{ steps.release_meta.outputs.tag }}"
          release-assets release-npm "${{ steps.release_meta.outputs.sha }}"

      - name: Publish verified GitHub Release
        id: publish_release
        if: steps.distribution.outputs.outcome == 'distributed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pnpm exec nx run axm:reconcile-github-release --outputStyle=static --
          publish "${{ steps.release_meta.outputs.tag }}"
          "${{ steps.release_meta.outputs.sha }}"

  bootstrap-prerelease:
    name: Publish Bootstrap Prerelease
    needs: source
    if: needs.source.outputs.eligible == 'true' && needs.source.outputs.mode == 'bootstrap-prerelease'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish.outputs.version }}
      ci_run_id: ${{ steps.publish.outputs.ci_run_id }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Set up npm 11.5.1
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Publish exact bootstrap npm cohort
        id: publish
        run: >-
          pnpm exec nx run axm:publish-bootstrap-prerelease --outputStyle=static --
          "${{ needs.source.outputs.sha }}" "${{ github.run_id }}"

  bootstrap-prerelease-verify:
    name: Verify Bootstrap Prerelease Install
    needs: [source, bootstrap-prerelease]
    if: needs.bootstrap-prerelease.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-workspace
        with:
          install: "false"

      - name: Verify exact npm installation
        env:
          EXPECTED_VERSION: ${{ needs.bootstrap-prerelease.outputs.version }}
        run: |
          npm install --global "axm.sh@${EXPECTED_VERSION}"
          actual="$(axm --version)"
          if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
            echo "Expected $EXPECTED_VERSION, observed $actual."
            exit 1
          fi

  skill-publish:
    name: Publish AXM Skill
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.outcome == 'distributed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Download released AXM binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern axm-linux-x64 \
            --dir release-assets
          chmod +x release-assets/axm-linux-x64

      - name: Publish bundled AXM skill
        env:
          AXM_TOKEN: ${{ secrets.AXM_REGISTRY_TOKEN }}
        run: |
          release-assets/axm-linux-x64 skills publish @agentxm/skills/axm \
            --registry-url https://registry.agentxm.ai \
            --on-existing verify \
            --non-interactive \
            --json

  skill-verify:
    name: Verify AXM Skill Install
    needs:
      - release
      - skill-publish
    if: ${{ needs.skill-publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download released AXM binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern axm-linux-x64 \
            --dir release-assets
          chmod +x release-assets/axm-linux-x64

      - name: Verify clean-workspace skill resolution
        env:
          AXM_EXPECTED_VERSION: ${{ needs.release.outputs.version }}
          AXM_REGISTRY_URL: https://registry.agentxm.ai
        run: |
          set -euo pipefail
          axm_binary="$GITHUB_WORKSPACE/release-assets/axm-linux-x64"
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT

          for attempt in 1 2 3 4 5; do
            workspace="$verification_root/attempt-$attempt"
            mkdir -p "$workspace"
            cd "$workspace"

            if "$axm_binary" setup --scope project --agent claude-code --yes --non-interactive; then
              actual_version="$(
                "$axm_binary" skills show axm --json |
                  jq -r '.result.item.version'
              )"
              skill_document="agent_extensions/agentxm/@agentxm/skills/axm/src/SKILL.md"

              if [[ "$actual_version" == "$AXM_EXPECTED_VERSION" ]] &&
                grep -Fq "cli-version: \"$AXM_EXPECTED_VERSION\"" "$skill_document"; then
                echo "Verified @agentxm/skills/axm@$AXM_EXPECTED_VERSION"
                exit 0
              fi
            fi

            echo "Skill version has not propagated yet (attempt $attempt/5)."
            sleep 10
          done

          echo "Expected @agentxm/skills/axm@$AXM_EXPECTED_VERSION from the production registry."
          exit 1

  install-verify:
    name: Installer Verification - ${{ matrix.os }} - ${{ matrix.mode }}
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.outcome == 'distributed' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: bash
          - os: macos-latest
            mode: bash
          - os: windows-latest
            mode: powershell
          - os: windows-latest
            mode: cmd
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      # Do NOT switch this job to the setup-workspace (mise) composite without
      # first re-verifying the windows-latest cmd and powershell legs. They run
      # on Corepack because mise-provisioned pnpm failed there with
      # `ENOENT pnpm.cmd`, and installer verification is the last gate before a
      # release reaches users.
      #
      # Because the composite cannot be used here, this job is the one place
      # that duplicates mise.toml's toolchain versions. They are not
      # independent pins: they must be kept in step with mise.toml, and
      # `pnpm run check:ci-toolchain` (scripts/check-ci-toolchain.mjs) fails the build
      # if they drift.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run installer verification
        env:
          AXM_INSTALL_TEST_MODE: ${{ matrix.mode }}
          AXM_INSTALL_BASE_URL: https://github.com/agentxm/axm/releases/download/${{ needs.release.outputs.tag }}
          AXM_EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: pnpm exec nx run cli-e2e:install-verification

      - name: Generate Allure report
        if: always()
        run: pnpm exec nx run axm:allure-report --outputStyle=static

      - name: Upload installer verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-verification-${{ matrix.os }}-${{ matrix.mode }}
          path: test-results/cli-e2e-install/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer verification Allure report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: allure-report-install-verification-${{ matrix.os }}-${{ matrix.mode }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

  brew-verify:
    name: Verify Homebrew Install
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.outcome == 'distributed' }}
    runs-on: macos-latest
    steps:
      - name: Remove existing Homebrew install
        run: |
          brew uninstall axm || true
          brew untap agentxm/tap || true

      - name: Install from Homebrew tap
        run: brew install agentxm/tap/axm

      - name: Verify installed axm version
        env:
          AXM_EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: |
          stderr_file="$(mktemp)"
          actual_version="$(axm --version 2>"$stderr_file")"
          actual_stderr="$(cat "$stderr_file")"
          rm -f "$stderr_file"
          expected_version="${AXM_EXPECTED_VERSION}"

          if [ -n "$actual_stderr" ]; then
            echo "Expected no stderr output"
            echo "Received stderr:"
            echo "$actual_stderr"
            exit 1
          fi

          if [ "$actual_version" != "$expected_version" ]; then
            echo "Expected $expected_version"
            echo "Received $actual_version"
            exit 1
          fi

      - name: Clean up Homebrew install
        if: always()
        run: |
          brew uninstall axm || true
          brew untap agentxm/tap || true

  package-verify:
    name: Published Package Verification - ${{ matrix.os }} - ${{ matrix.manager }}
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.outcome == 'distributed' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            manager: npm
          - os: macos-latest
            manager: npm
          - os: windows-latest
            manager: npm
          - os: ubuntu-latest
            manager: pnpm
          - os: ubuntu-latest
            manager: yarn
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      # The Windows leg needs the same Corepack setup as installer verification:
      # setup-workspace's mise-provisioned pnpm is not available as pnpm.cmd.
      # Keep these pins aligned with mise.toml through check:ci-toolchain.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Yarn Classic
        if: matrix.manager == 'yarn'
        run: corepack prepare yarn@1.22.22 --activate

      - name: Verify clean published package installation
        run: >-
          pnpm exec nx run axm:verify-installed-package --
          "${{ matrix.manager }}" "${{ needs.release.outputs.version }}"

  promote:
    name: Promote Verified Candidate to Stable
    needs: [release, install-verify, package-verify, brew-verify, skill-publish, skill-verify]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' &&
          needs.release.outputs.outcome == 'distributed' &&
          needs.install-verify.result == 'success' && needs.package-verify.result == 'success' &&
          needs.brew-verify.result == 'success' && needs.skill-publish.result == 'success' &&
          needs.skill-verify.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.promotion.outputs.outcome }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
      - name: Download candidate assets for descriptor validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Promote stable release channel
        id: promotion
        env:
          AXM_RELEASE_CONTROL_TOKEN: ${{ secrets.AXM_RELEASE_CONTROL_TOKEN }}
          AXM_CONTROL_ACCESS_CLIENT_ID: ${{ secrets.AXM_CONTROL_ACCESS_CLIENT_ID }}
          AXM_CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.AXM_CONTROL_ACCESS_CLIENT_SECRET }}
        run: >-
          pnpm exec nx run axm:promote-release-channel --outputStyle=static --
          "${{ needs.release.outputs.version }}" "${{ needs.release.outputs.tag }}"
          "${{ needs.release.outputs.sha }}" release-assets

  summary:
    name: Release Publication Summary
    needs:
      [
        source,
        release,
        bootstrap-prerelease,
        bootstrap-prerelease-verify,
        install-verify,
        package-verify,
        brew-verify,
        skill-publish,
        skill-verify,
        promote,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record distribution, verification, and promotion results
        env:
          ELIGIBLE: ${{ needs.source.outputs.eligible }}
          MODE: ${{ needs.source.outputs.mode }}
          RELEASE_TAG: ${{ needs.release.outputs.tag || needs.source.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release.outputs.sha }}
          GITHUB_RELEASE: ${{ needs.release.outputs.github_release }}
          PUBLICATION: ${{ needs.release.outputs.publication }}
          DISTRIBUTION: ${{ needs.release.outputs.outcome }}
          PROMOTION: ${{ needs.promote.outputs.outcome }}
          BOOTSTRAP_VERSION: ${{ needs.bootstrap-prerelease.outputs.version }}
          BOOTSTRAP_VERIFY: ${{ needs.bootstrap-prerelease-verify.result }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Canonical release workflow"
            echo "Mode: ${MODE:-not selected}"
            if [ "$ELIGIBLE" != true ]; then
              echo "The completed CI run did not identify a release commit; no publication was attempted."
              exit 0
            fi
            if [ "$MODE" = bootstrap-prerelease ]; then
              echo "Bootstrap prerelease: ${BOOTSTRAP_VERSION:-not published}"
              echo "Exact npm install verification: ${BOOTSTRAP_VERIFY:-not run}"
              exit 0
            fi
            echo "Release: $RELEASE_TAG"
            echo "Candidate: $RELEASE_VERSION at $RELEASE_COMMIT"
            echo "GitHub Release: ${GITHUB_RELEASE:-not completed}"
            echo "Publication boundaries: ${PUBLICATION:-not completed}"
            echo "$RESULTS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"'
            if [ "$DISTRIBUTION" = superseded ] || [ "$PROMOTION" = newer-channel-retained ]; then
              echo "Superseded candidate; stable release completion is not claimed."
            elif [ "$PROMOTION" = promoted ] || [ "$PROMOTION" = already-current ]; then
              echo "Promotion confirmed for the verified candidate."
            elif [ "$DISTRIBUTION" = distributed ] && echo "$RESULTS" | jq -e '[.["install-verify"].result, .["package-verify"].result, .["brew-verify"].result, .["skill-publish"].result, .["skill-verify"].result] | all(. == "success")' >/dev/null; then
              echo "Distribution complete; promotion incomplete or uncertain. Inspect promotion submission/readback evidence."
            else
              echo "Distribution or verification incomplete; promotion readiness was not established."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
