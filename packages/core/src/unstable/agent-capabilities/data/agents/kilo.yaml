# yaml-language-server: $schema=../../agent.schema.json
id: kilo
name: Kilo Code
vendor: Kilo
homepage: https://kilo.ai
interfaces:
  - cli
  - ide-extension
docs:
  - label: Kilo Code documentation
    url: https://kilo.ai/docs
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .kilocode/skills
  sources:
    - https://kilo.ai/docs/customize/skills
  lastVerified: 2026-05-20
commands:
  notes: No industry spec for slash commands yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  directory: .kilo/commands
  sources:
    - https://kilo.ai/docs/customize/workflows
  lastVerified: 2026-05-20
mcp:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  transports:
    - stdio
    - http
  config:
    serversKey: mcp
    nativeEnabled: true
    targets:
      - scope: user
        path: ~/.config/kilo/kilo.jsonc
        format: jsonc
      - scope: project
        path: kilo.jsonc
        format: jsonc
      - scope: project
        path: .kilo/kilo.jsonc
        format: jsonc
    stdio:
      typeField:
        name: type
        value: local
      command: array
      envKey: environment
    remote:
      typeField:
        name: type
        value:
          streamable-http: remote
          sse: remote
      urlKey:
        streamable-http: url
        sse: url
      headersKey: headers
  sources:
    - https://kilo.ai/docs/features/mcp/using-mcp-in-kilo-code
  lastVerified: 2026-05-20
subagents:
  notes: No industry spec for subagents yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://kilo.ai/docs/customize/custom-subagents
  lastVerified: 2026-05-20
  directory: .kilo/agents
  layout: directory
instructions:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  files:
    - AGENTS.md
  nestedDiscovery: true
  sources:
    - https://kilo.ai/docs/agent-behavior/custom-instructions
  lastVerified: 2026-05-20
  kind: agents-md
rootDir: .kilocode
