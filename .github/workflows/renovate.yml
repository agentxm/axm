name: Renovate

run-name: >-
  ${{ github.event_name == 'schedule' && 'Scheduled Renovate run' ||
  format('Renovate {0}', inputs.dryRun && 'dry run' || 'run') }}

# Renovate is self-hosted here rather than installed as the Mend-hosted app.
# The hosted Community tier allows one concurrent job per *organization*, shared
# by every repository in it, on a 1 vCPU / 3 GB runner with a 30-minute timeout.
# Renovate resolves lockfiles by running the workspace's own installer, so that
# budget is not a safe fit for this workspace and would have made the paid tier
# the remedy for a constraint self-hosting does not impose. Running it here also
# keeps the credential repository-owned. Rationale and the rejected alternative:
# devops/tools/renovate.md

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Resolve updates and log them without opening pull requests.
        required: true
        default: true
        type: boolean
      logLevel:
        description: Renovate log verbosity.
        required: false
        default: info
        type: choice
        options: [info, debug]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Renovate authenticates as a repository-owned GitHub App rather than a
      # personal token, so its pull requests are attributable and the credential
      # is short-lived. Provisioning and rotation belong to the GitHub provider
      # record.
      - name: Mint a Renovate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Scope the token to what Renovate actually needs instead of
          # inheriting the installation's blanket permissions: branches to push,
          # pull requests to open, issues for the dependency dashboard, and
          # workflows because the github-actions manager edits files under
          # .github/workflows.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Checkout exact invocation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Renovate reads .github/renovate.json5 for everything else; only the
      # run-scoped settings live here.
      - name: Run Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
