# yaml-language-server: $schema=../../agent.schema.json
id: qwen-code
name: Qwen Code
vendor: Alibaba Cloud
homepage: https://qwenlm.github.io/qwen-code-docs/
interfaces:
  - cli
family: alibaba
docs:
  - label: Qwen Code documentation
    url: https://qwenlm.github.io/qwen-code-docs/
skills:
  support: standard
  scopes:
    - user
    - project
  directory: .qwen/skills
  sources:
    - https://qwenlm.github.io/qwen-code-docs/en/users/features/skills/
  lastVerified: 2026-05-20
mcp:
  support: standard
  scopes:
    - user
    - project
  transports:
    - stdio
    - http
    - sse
  config:
    serversKey: mcpServers
    nativeEnabled: true
    targets:
      - scope: user
        path: ~/.qwen/settings.json
        format: json
      - scope: project
        path: .qwen/settings.json
        format: json
    stdio:
      command: split
      envKey: env
    remote:
      typeField:
        name: type
        value:
          streamable-http: http
          sse: sse
      urlKey:
        streamable-http: url
        sse: url
      headersKey: headers
  sources:
    - https://qwenlm.github.io/qwen-code-docs/en/users/features/mcp/
  lastVerified: 2026-05-20
subagents:
  support: bridged
  scopes:
    - user
    - project
  sources:
    - https://qwenlm.github.io/qwen-code-docs/en/users/features/sub-agents/
  lastVerified: 2026-05-20
  directory: .qwen/agents
  layout: directory
rootDir: .qwen
