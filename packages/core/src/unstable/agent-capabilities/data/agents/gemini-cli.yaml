# yaml-language-server: $schema=../../agent.schema.json
id: gemini-cli
name: Gemini CLI
vendor: Google
homepage: https://github.com/google-gemini/gemini-cli
interfaces: [cli]
family: google
docs:
  - label: Gemini CLI documentation
    url: https://github.com/google-gemini/gemini-cli/tree/main/docs

skills:
  support: standard
  scopes: [user, project]
  directory: .gemini/skills
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/cli-reference.md
  lastVerified: 2026-05-16

mcp:
  support: standard
  scopes: [user, project]
  transports: [stdio]
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/cli-reference.md
  lastVerified: 2026-05-16

instructions:
  support: bridged
  scopes: [user, project]
  files: [GEMINI.md]
  nestedDiscovery: true
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/configuration.md
  lastVerified: 2026-05-16

permissions:
  support: standard
  scopes: [user, project]
  mechanism: [config-file, cli-flag]
  configFiles:
    - scope: user
      path: "~/.gemini/settings.json"
      format: json
    - scope: project
      path: .gemini/settings.json
      format: json
  grammar:
    style: prefix
    example: run_shell_command(axm)
    notes: >
      tools.core is prefix-matched and currently documented in docs/tools/shell.md.
      The newer Policy Engine is replacing --allowed-tools; tools.core is still
      functional but transitional.
  prerequisites:
    - key: security.folderTrust.enabled
      value: "true"
      scope: user
      note: Untrusted folders disable all auto-acceptance regardless of other settings.
  cliFlags:
    - flag: "--approval-mode=yolo"
      note: Broad bypass; not tool-scoped. Blocked when security.disableYoloMode=true.
    - flag: "--yolo"
      note: Alias for --approval-mode=yolo.
  grants:
    shell:
      target: "~/.gemini/settings.json"
      patch:
        security:
          folderTrust:
            enabled: true
          enablePermanentToolApproval: true
        tools:
          core:
            - "run_shell_command(${tool})"
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/settings.md
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/cli-reference.md
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/tools/shell.md
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/trusted-folders.md
  lastVerified: 2026-05-18
