# yaml-language-server: $schema=../../agent.schema.json
id: trae-cn
name: Trae CN
vendor: ByteDance
homepage: https://www.trae.cn
interfaces: [ide-extension]
family: bytedance
docs:
  - label: Trae CN documentation
    url: https://docs.trae.cn

skills:
  support: bridged
  scopes: [project]
  directory: .trae/skills
  sources:
    - https://forum.trae.cn/t/topic/8191
  lastVerified: 2026-05-20

mcp:
  support: standard
  scopes: [project]
  transports: [stdio, http, sse]
  config:
    serversKey: mcpServers
    nativeEnabled: true
    targets:
      - { scope: project, path: .trae/mcp.json, format: json }
    stdio:
      command: split
      envKey: env
    remote:
      typeField: { name: type, value: { streamable-http: http, sse: sse } }
      urlKey: { streamable-http: url, sse: url }
      headersKey: headers
  sources:
    - https://forum.trae.cn/t/topic/8191
  lastVerified: 2026-05-20

rules:
  support: bridged
  scopes: [project]
  directory: .trae/rules
  sources:
    - https://forum.trae.cn/t/topic/8191
  lastVerified: 2026-05-20
