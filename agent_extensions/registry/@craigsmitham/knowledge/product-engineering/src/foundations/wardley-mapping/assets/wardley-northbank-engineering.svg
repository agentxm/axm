    <g text-anchor="middle" font-size="15" font-weight="700">
      <text x="202" y="554">Genesis</text><text x="407" y="554">Custom-built</text>
      <text x="612" y="554">Product</text><text x="817" y="554">Commodity</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#475569"><text x="612" y="574">including rental</text><text x="817" y="574">including utility</text></g>
