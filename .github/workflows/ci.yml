name: CI
run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI - PR #{0}', github.event.pull_request.number) ||
    format('CI - {0}', github.ref_name)
  }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "contributing/**"
      - "*.md"
      - ".github/pull_request_template.md"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  checks: write
  contents: read
  packages: read

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: static
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"
  NX_PARALLEL: "2"
  VITEST_MAX_WORKERS: "2"
  AXM_CI_IMAGE: ghcr.io/agentxm/agentxm-ci:0.1.0

jobs:
  verify:
    name: Verify Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Create local main ref for affected/base diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:main

      - name: Classify pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          docs_only=true
          release_preparation=false

          while IFS= read -r -d '' path; do
            if [[ "$path" == contributing/* ]] ||
              [[ "$path" != */* && "$path" == *.md ]] ||
              [[ "$path" == ".github/pull_request_template.md" ]]; then
              continue
            fi

            docs_only=false
            break
          done < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA")

          release_subject="release: ${HEAD_REF#release/}"
          if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] &&
            [[ "$HEAD_REF" =~ ^release/cli-v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] &&
            [[ "$(git show --no-patch --format=%s "$HEAD_SHA")" == "$release_subject" ]]; then
            release_preparation=true
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "release_preparation=$release_preparation" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        if: github.event_name == 'pull_request' &&
          steps.changes.outputs.docs_only == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        if: github.event_name == 'pull_request' &&
          steps.changes.outputs.docs_only == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm --version

      - name: Install dependencies
        if: github.event_name == 'pull_request' &&
          steps.changes.outputs.docs_only == 'true'
        run: pnpm install --frozen-lockfile

      - name: Log in to GHCR
        if: github.event_name == 'push' ||
          steps.changes.outputs.docs_only != 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify affected pull request changes in shared Linux environment
        if: github.event_name == 'pull_request' &&
          steps.changes.outputs.docs_only != 'true'
        run: |
          scripts/container-environment.sh ci bash -lc \
            'set -euo pipefail
            pnpm install --frozen-lockfile
            if [[ "${{ steps.changes.outputs.release_preparation }}" != "true" ]]; then
              pnpm release:plan:check
            fi
            pnpm run ci:affected'

      - name: Verify documentation
        if: github.event_name == 'pull_request' &&
          steps.changes.outputs.docs_only == 'true'
        run: pnpm run format:check

      - name: Verify main in shared Linux environment
        if: github.event_name == 'push'
        run: |
          scripts/container-environment.sh ci bash -lc \
            'pnpm install --frozen-lockfile && pnpm run ci'

      - name: Upload JUnit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.changes.outputs.docs_only != 'true'
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always() && steps.changes.outputs.docs_only != 'true'
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results
          include_passed: true

  binary-smoke:
    name: Binary Smoke - ${{ matrix.os }}
    needs: verify
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: axm-linux-x64
          - os: ubuntu-24.04-arm
            binary_name: axm-linux-arm64
          - os: macos-latest
            binary_name: axm-darwin-arm64
          - os: macos-15-intel
            binary_name: axm-darwin-x64
          - os: windows-latest
            binary_name: axm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile host binary
        run: pnpm exec nx run cli:compile --outputStyle=static -- --host-only

      - name: Mark binary executable
        if: runner.os != 'Windows'
        run: chmod +x packages/cli/dist/bin/${{ matrix.binary_name }}

      - name: Run binary smoke test
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/packages/cli/dist/bin/${{ matrix.binary_name }}
        run: pnpm exec nx run cli-e2e:binary-smoke-artifact --outputStyle=static

      - name: Upload compiled binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axm-binary-${{ matrix.binary_name }}-${{ github.sha }}
          path: packages/cli/dist/bin/${{ matrix.binary_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
