schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  proposal:
    - focus on the functional behavior and interaction patterns of the API or feature, not the implementation details
    - backward compatability is a non-goal
  design:
    - backward compatability is a non-goal
    - should always require linting to pass
  tasks:
    - "TDD: add (design) or update tests prior to implementation step: red, green, refactor until a good design"
    - "Add a typecheck verification step immediately after any implementation task, fix any issues found"
    - "Add step to run typecheck for all packages (`pnpm typecheck`) after every task group, fix any errors"
    - "Add step to run linting for all packages (`pnpm lint`) after every task group, fix any errors"
    - "Add step to run tests for all packages (`pnpm test`) after every task group, fix any failures"
    - "Add step to run relevant e2e tests (`pnpm test:e2e`) after every task group, fix any failures"
    - "Add a step to kill any vitest worker processes after testing verification"
