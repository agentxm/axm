name: Set up workspace toolchain
description: >-
  Install the host toolchain (Node, pnpm, Bun, Gitleaks) from mise.toml — the repository
  tool-version authority — and install workspace dependencies. Single source of
  truth for host-side toolchain setup so the versions live in mise.toml once and
  are never copied into individual workflow jobs.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after toolchain setup.
    required: false
    default: "true"

  remote-cache-bypass:
    description: Repository NX_SKIP_REMOTE_CACHE setting forwarded by the caller.
    required: false
    default: ""
  remote-cache-url:
    description: Native Nx remote-cache server URL; empty disables remote caching.
    required: false
    default: ""
  remote-cache-token:
    description: Read-only cache credential; only the trusted main warmer supplies a writer.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install toolchain from mise.toml
      uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
      with:
        # Other refs can restore main's toolchain without publishing duplicate caches.
        cache_save: ${{ github.ref == 'refs/heads/main' }}

    - name: Install Linux native prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Hosted Ubuntu images configure this mirror list with Azure HTTP first.
        # Keep the image's HTTPS archive/security mirrors when Azure stalls.
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
        fi
        sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
        sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends libsecret-1-dev

    - name: Install workspace dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Configure native Nx remote caching
      uses: ./.github/actions/configure-nx-remote-cache
      with:
        bypass: ${{ inputs.remote-cache-bypass }}
        url: ${{ inputs.remote-cache-url }}
        token: ${{ inputs.remote-cache-token }}
        actor: ${{ github.actor }}
        fork: ${{ github.event.pull_request.head.repo.fork || false }}
