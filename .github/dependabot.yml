# Local policy and manual cohorts: devops/tools/dependabot.md
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      # Match the existing zizmor policy; security updates bypass this delay.
      default-days: 7
    open-pull-requests-limit: 4
    rebase-strategy: disabled
    versioning-strategy: increase
    # Routine updates cover direct manifests; security fixes can still update
    # vulnerable indirect packages and may require a major update.
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # Effect runtime and tooling move through coordinated manual changes.
      # These ignores also require manual security remediation.
      - dependency-name: effect
      - dependency-name: "@effect/*"
      # Types must not describe a newer runtime than the declared Node floor.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      weekly-npm:
        patterns: ["*"]
        update-types: [minor, patch]
      security-npm:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    # Root covers workflows; local composite actions need their own directories.
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns: ["*"]
      security-actions:
        applies-to: security-updates
        patterns: ["*"]
