# yaml-language-server: $schema=../../agent.schema.json
id: cursor
name: Cursor
vendor: Anysphere
homepage: https://cursor.com
interfaces: [ide-extension, cli]
family: cursor
docs:
  - label: Cursor documentation
    url: https://docs.cursor.com

skills:
  support: standard
  scopes: [user, project]
  directory: .cursor/skills
  notes: >
    Cursor 2.4 added Agent Skills (SKILL.md) across the editor and the
    cursor-agent CLI; it also loads .claude/skills and .codex/skills for
    cross-tool compatibility.
  sources:
    - https://cursor.com/docs/context/skills
    - https://cursor.com/changelog/2-4
  lastVerified: 2026-05-18

commands:
  support: bridged
  scopes: [user, project]
  directory: .cursor/commands
  notes: >
    Custom commands are Markdown prompt files under .cursor/commands (project)
    or ~/.cursor/commands (user); documented as a beta feature.
  sources:
    - https://docs.cursor.com/en/agent/chat/commands
    - https://cursor.com/changelog/1-6
  lastVerified: 2026-05-18

mcp:
  support: standard
  scopes: [user, project]
  transports: [stdio, http, sse]
  sources:
    - https://docs.cursor.com/advanced/model-context-protocol
  lastVerified: 2026-05-16

subagents:
  support: bridged
  scopes: [user, project]
  notes: >
    Custom subagents are Markdown files with YAML frontmatter under
    .cursor/agents (project) or ~/.cursor/agents (user); added in Cursor 2.4.
  sources:
    - https://cursor.com/docs/subagents
    - https://cursor.com/changelog/2-4
  lastVerified: 2026-05-18

instructions:
  support: standard
  scopes: [project]
  files: [AGENTS.md, CLAUDE.md]
  nestedDiscovery: false
  sources:
    - https://docs.cursor.com/en/cli/using
  lastVerified: 2026-05-16

rules:
  support: bridged
  scopes: [project]
  directory: .cursor/rules
  sources:
    - https://docs.cursor.com/en/context/rules
  lastVerified: 2026-05-16

permissions:
  support: standard
  scopes: [user, project]
  mechanism: [config-file, ui-only, cli-flag]
  configFiles:
    # IDE terminal allowlist (user scope only - no per-project IDE override).
    - scope: user
      path: "~/.cursor/permissions.json"
      format: json
      gitignored: false
    # Sandbox supports both user and project scope.
    - scope: user
      path: "~/.cursor/sandbox.json"
      format: json
      gitignored: false
    - scope: project
      path: .cursor/sandbox.json
      format: json
      gitignored: false
    # cursor-agent CLI supports both scopes.
    - scope: user
      path: "~/.cursor/cli-config.json"
      format: json
      gitignored: false
    - scope: project
      path: .cursor/cli.json
      format: json
      gitignored: false
  grammar:
    style: prefix
    example: axm
    notes: >
      IDE: case-sensitive command prefix in terminalAllowlist. CLI: Tool-call
      syntax Shell()/Read()/Write() with glob patterns. Deny always beats allow.
  prerequisites:
    - key: "Settings > Cursor Settings > Agents > Auto-Run"
      value: "Run in Sandbox | Run Everything"
      scope: user
      note: IDE Auto-Run must be enabled before terminalAllowlist takes effect.
  cliFlags:
    - flag: "--force"
      note: Bypasses cursor-agent prompts (community-documented; verify against --help).
    - flag: "--yolo"
      note: Bypasses cursor-agent prompts (community-documented; verify against --help).
  grants:
    shell:
      target: "~/.cursor/permissions.json"
      patch:
        terminalAllowlist:
          - "${tool}"
    cliShell:
      target: .cursor/cli.json
      patch:
        permissions:
          allow:
            - "Shell(${tool})"
            - "Shell(${tool}:*)"
    filesystem:
      target: .cursor/sandbox.json
      patch:
        type: workspace_readwrite
        additionalReadwritePaths: []
  sources:
    - https://cursor.com/docs/reference/permissions
    - https://cursor.com/docs/reference/sandbox
    - https://cursor.com/docs/agent/tools/terminal
    - https://cursor.com/docs/cli/reference/permissions
  lastVerified: 2026-05-18
