# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: claude-code
name: Claude Code
vendor: Anthropic
homepage: https://claude.com/claude-code
interfaces:
  - cli
  - ide-extension
family: anthropic
docs:
  - label: Claude Code documentation
    url: https://docs.claude.com/en/docs/claude-code
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .claude/skills
  sources:
    - https://docs.claude.com/en/docs/claude-code/skills
  lastVerified: 2026-05-16
commands:
  scopes:
    - user
    - project
  directory: .claude/commands
  notes: >
    Custom slash commands are Markdown prompt files under .claude/commands. Commands have no
    industry spec yet.
  sources:
    - https://docs.claude.com/en/docs/claude-code/slash-commands
  lastVerified: 2026-05-18
mcp:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  transports:
    - stdio
    - http
    - sse
  config:
    serversKey: mcpServers
    nativeEnabled: false
    targets:
      - scope: project
        path: .mcp.json
        format: json
    stdio:
      typeField:
        name: type
        value: stdio
      command: split
      envKey: env
    remote:
      typeField:
        name: type
        value:
          streamable-http: http
          sse: sse
      urlKey:
        streamable-http: url
        sse: url
      headersKey: headers
  sources:
    - https://docs.claude.com/en/docs/claude-code/mcp
  lastVerified: 2026-05-16
subagents:
  notes: No industry spec for subagents yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://docs.claude.com/en/docs/claude-code/sub-agents
  lastVerified: 2026-05-16
  directory: .claude/agents
  layout: directory
hooks:
  notes: Managed hooks merge into the Claude Code settings hooks block and execute materialized AXM package entrypoints.
  scopes:
    - user
    - project
  configFiles:
    - scope: user
      path: ~/.claude/settings.json
      format: json
      gitignored: false
    - scope: project
      path: .claude/settings.json
      format: json
      gitignored: false
    - scope: project
      path: .claude/settings.local.json
      format: json
      gitignored: true
  serializer: claude-code-settings
  sources:
    - https://docs.claude.com/en/docs/claude-code/hooks
    - https://docs.claude.com/en/docs/claude-code/settings
  lastVerified: 2026-06-02
instructions:
  standardsCompliance: parity
  convention: vendor
  notes: Reads CLAUDE.md, not the AGENTS.md spec filename.
  scopes:
    - user
    - project
  files:
    - CLAUDE.md
  nestedDiscovery: true
  sources:
    - https://docs.claude.com/en/docs/claude-code/memory
  lastVerified: 2026-05-16
  kind: own-file
  importSyntax: at-path
permissions:
  scopes:
    - user
    - project
  mechanism:
    - config-file
  configFiles:
    - scope: user
      path: ~/.claude/settings.json
      format: json
      gitignored: false
    - scope: project
      path: .claude/settings.json
      format: json
      gitignored: false
    - scope: project
      path: .claude/settings.local.json
      format: json
      gitignored: true
  grammar:
    style: tool-call
    example: Bash(axm:*)
    notes: >
      Tool(specifier) with * wildcards. Evaluated deny > ask > allow (first match wins). Settings
      merge across scopes rather than override.
  grants:
    shell:
      target: ~/.claude/settings.json
      patch:
        permissions:
          allow:
            - Bash(${tool}:*)
    filesystem:
      target: ~/.claude/settings.json
      patch:
        permissions:
          allow:
            - Read(${workspaceRoot}/**)
            - Write(${workspaceRoot}/**)
            - Edit(${workspaceRoot}/**)
  sources:
    - https://docs.claude.com/en/docs/claude-code/iam
    - https://docs.claude.com/en/docs/claude-code/settings
  lastVerified: 2026-05-18
rootDir: .claude
