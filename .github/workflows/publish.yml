name: Release
run-name: >-
  ${{
    github.run_attempt > 1 &&
    format('Release - {0} - rerun {1}', inputs.release_tag || github.event.release.tag_name, github.run_attempt) ||
    format('Release - {0}', inputs.release_tag || github.event.release.tag_name)
  }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example cli-v0.1.1
        required: true
        type: string
      channel_already_promoted:
        description: Verify this exact release is already stable instead of promoting it again
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: "static"
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"

concurrency:
  group: release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      version: ${{ steps.release_meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      # npm is not a mise.toml tool; the release job needs a newer npm than the
      # one bundled with Node for `npm publish --provenance`.
      - name: Set up npm 11.5.1
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Resolve release tag and commit
        id: release_meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          pnpm exec nx run axm:resolve-release-meta --outputStyle=static

      - name: Download release binaries from CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec nx run axm:download-ci-binaries --outputStyle=static -- "${{ steps.release_meta.outputs.sha }}" release-assets

      - name: Generate release checksums
        run: pnpm exec nx run axm:generate-release-checksums --outputStyle=static -- release-assets

      - name: Validate release asset set
        run: pnpm exec nx run axm:validate-release-assets --outputStyle=static -- release-assets

      - name: Attach binaries and checksums to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release_meta.outputs.tag }}" release-assets/* --clobber

      - name: Verify pre-promoted stable release channel
        if: ${{ inputs.channel_already_promoted == true }}
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_SHA: ${{ steps.release_meta.outputs.sha }}
        run: |
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          document="$(
            curl -fsS \
              -H 'Accept: application/json' \
              -H 'Accept-Encoding: identity' \
              -D "$headers" \
              https://releases.axm.sh/v1/channels/stable.json
          )"
          etag="$(
            awk 'BEGIN { IGNORECASE = 1 } /^etag:/ {
              sub(/^[^:]+:[[:space:]]*/, "")
              sub(/\r$/, "")
              print
              exit
            }' "$headers"
          )"
          if [[ ! "$etag" =~ ^\"[^\"]+\"$ ]]; then
            echo "The pre-promoted stable channel did not provide a strong ETag."
            exit 1
          fi
          jq -e \
            --arg version "$VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_SHA" \
            '.schema == "axm.release-channel/v1" and
             .channel == "stable" and
             .version == $version and
             .release.tag == $tag and
             .release.commit == $commit' \
            <<<"$document"

      - name: Promote stable release channel
        if: ${{ inputs.channel_already_promoted != true }}
        env:
          AXM_RELEASE_CONTROL_TOKEN: ${{ secrets.AXM_RELEASE_CONTROL_TOKEN }}
          AXM_CONTROL_ACCESS_CLIENT_ID: ${{ secrets.AXM_CONTROL_ACCESS_CLIENT_ID }}
          AXM_CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.AXM_CONTROL_ACCESS_CLIENT_SECRET }}
        run: >-
          pnpm exec nx run axm:promote-release-channel --outputStyle=static --
          "${{ steps.release_meta.outputs.version }}"
          "${{ steps.release_meta.outputs.tag }}"
          "${{ steps.release_meta.outputs.sha }}"

      - name: Build npm packages
        run: pnpm exec nx run-many -t build --projects tag:release:cli --outputStyle=static

      - name: Pack and publish npm packages
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          rm -rf release-packages
          mkdir -p release-packages
          release_packages=(
            "@agentxm/extension-model"
            "@agentxm/agent-integration"
            "@agentxm/registry-protocol"
            "@agentxm/knowledge-query"
            "@agentxm/registry-client"
            "@agentxm/workspace-state"
            "@agentxm/extension-sources"
            "@agentxm/registry-auth"
            "@agentxm/workspace-operations"
            "@agentxm/extension-workspace"
            "@agentxm/extension-authoring"
            "@agentxm/extension-discovery"
            "@agentxm/extension-lifecycle"
            "@agentxm/extension-publish"
            "@agentxm/workspace-configuration"
            "@agentxm/workspace-inspection"
            "@agentxm/workspace-lint"
            "@agentxm/workspace-sync"
            "axm.sh"
          )

          for package_name in "${release_packages[@]}"; do
            pnpm --filter "$package_name" pack --pack-destination release-packages
          done

          unset NODE_AUTH_TOKEN
          unset NPM_CONFIG_USERCONFIG

          publish_if_missing() {
            local package_name="$1"
            local tarball_prefix="${package_name#@}"
            tarball_prefix="${tarball_prefix//\//-}"
            local tarball_path="./release-packages/${tarball_prefix}-${VERSION}.tgz"

            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "Skipping ${package_name}@${VERSION}; already published."
              return 0
            fi

            npm publish "$tarball_path" --provenance --access public
          }

          for package_name in "${release_packages[@]}"; do
            publish_if_missing "$package_name"
          done

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          published_formula="$(curl -fsSL https://raw.githubusercontent.com/agentxm/homebrew-tap/main/Formula/axm.rb)"
          if grep -Fq "version \"${VERSION}\"" <<<"$published_formula"; then
            echo "Homebrew formula is already current at ${VERSION}; skipping update."
            exit 0
          fi

          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi

          git clone \
            --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/agentxm/homebrew-tap.git" \
            ../homebrew-tap

          HOMEBREW_TAP_DIR=../homebrew-tap \
          pnpm exec nx run axm:update-homebrew-formula --outputStyle=static -- "${{ steps.release_meta.outputs.version }}"

  skill-publish:
    name: Publish AXM Skill
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Download released AXM binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern axm-linux-x64 \
            --dir release-assets
          chmod +x release-assets/axm-linux-x64

      - name: Publish bundled AXM skill
        env:
          AXM_TOKEN: ${{ secrets.AXM_REGISTRY_TOKEN }}
        run: |
          release-assets/axm-linux-x64 skills publish @agentxm/skills/axm \
            --registry-url https://registry.agentxm.ai \
            --on-existing verify \
            --yes \
            --non-interactive \
            --json

  skill-verify:
    name: Verify AXM Skill Install
    needs:
      - release
      - skill-publish
    if: ${{ needs.skill-publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download released AXM binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern axm-linux-x64 \
            --dir release-assets
          chmod +x release-assets/axm-linux-x64

      - name: Verify clean-workspace skill resolution
        env:
          AXM_EXPECTED_VERSION: ${{ needs.release.outputs.version }}
          AXM_REGISTRY_URL: https://registry.agentxm.ai
        run: |
          set -euo pipefail
          axm_binary="$GITHUB_WORKSPACE/release-assets/axm-linux-x64"
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT

          for attempt in 1 2 3 4 5; do
            workspace="$verification_root/attempt-$attempt"
            mkdir -p "$workspace"
            cd "$workspace"

            if "$axm_binary" setup --scope project --agent claude-code --yes --non-interactive; then
              actual_version="$(
                "$axm_binary" skills show axm --json |
                  jq -r '.result.item.version'
              )"
              skill_document="agent_extensions/agentxm/@agentxm/skills/axm/src/SKILL.md"

              if [[ "$actual_version" == "$AXM_EXPECTED_VERSION" ]] &&
                grep -Fq "cli-version: \"$AXM_EXPECTED_VERSION\"" "$skill_document"; then
                echo "Verified @agentxm/skills/axm@$AXM_EXPECTED_VERSION"
                exit 0
              fi
            fi

            echo "Skill version has not propagated yet (attempt $attempt/5)."
            sleep 10
          done

          echo "Expected @agentxm/skills/axm@$AXM_EXPECTED_VERSION from the production registry."
          exit 1

  install-verify:
    name: Installer Verification - ${{ matrix.os }} - ${{ matrix.mode }}
    needs: release
    if: ${{ needs.release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: bash
          - os: macos-latest
            mode: bash
          - os: windows-latest
            mode: powershell
          - os: windows-latest
            mode: cmd
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Do NOT switch this job to the setup-workspace (mise) composite without
      # first re-verifying the windows-latest cmd and powershell legs. They run
      # on Corepack because mise-provisioned pnpm failed there with
      # `ENOENT pnpm.cmd`, and installer verification is the last gate before a
      # release reaches users.
      #
      # Because the composite cannot be used here, this job is the one place
      # that duplicates mise.toml's toolchain versions. They are not
      # independent pins: they must be kept in step with mise.toml, and
      # `pnpm run check:ci-image` (scripts/check-ci-image.mjs) fails the build
      # if they drift.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run installer verification
        env:
          AXM_INSTALL_TEST_MODE: ${{ matrix.mode }}
          AXM_INSTALL_BASE_URL: https://github.com/agentxm/axm/releases/download/${{ needs.release.outputs.tag }}
          AXM_EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: pnpm exec nx run cli-e2e:install-verification

      - name: Generate Allure report
        if: always()
        run: pnpm exec nx run axm:allure-report --outputStyle=static

      - name: Upload installer verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-verification-${{ matrix.os }}-${{ matrix.mode }}
          path: test-results/cli-e2e-install/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer verification Allure report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: allure-report-install-verification-${{ matrix.os }}-${{ matrix.mode }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

  brew-verify:
    name: Verify Homebrew Install
    needs: release
    if: ${{ needs.release.result == 'success' }}
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Remove existing Homebrew install
        run: |
          brew uninstall axm || true
          brew untap agentxm/tap || true

      - name: Install from Homebrew tap
        run: brew install agentxm/tap/axm

      - name: Verify installed axm version
        env:
          AXM_EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: |
          stderr_file="$(mktemp)"
          actual_version="$(axm --version 2>"$stderr_file")"
          actual_stderr="$(cat "$stderr_file")"
          rm -f "$stderr_file"
          expected_version="${AXM_EXPECTED_VERSION}"

          if [ -n "$actual_stderr" ]; then
            echo "Expected no stderr output"
            echo "Received stderr:"
            echo "$actual_stderr"
            exit 1
          fi

          if [ "$actual_version" != "$expected_version" ]; then
            echo "Expected $expected_version"
            echo "Received $actual_version"
            exit 1
          fi

      - name: Clean up Homebrew install
        if: always()
        run: |
          brew uninstall axm || true
          brew untap agentxm/tap || true
