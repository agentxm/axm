name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2.0.2

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5.0.1

      - name: Format check
        run: pnpm format:check

      - name: Lint
        if: github.event_name == 'pull_request'
        run: pnpm lint:affected

      - name: Lint
        if: github.ref == 'refs/heads/main'
        run: pnpm lint

      - name: Typecheck
        if: github.event_name == 'pull_request'
        run: pnpm typecheck:affected

      - name: Typecheck
        if: github.ref == 'refs/heads/main'
        run: pnpm typecheck

  build-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2.0.2

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5.0.1

      - name: Build
        if: github.event_name == 'pull_request'
        run: pnpm build:affected

      - name: Build
        if: github.ref == 'refs/heads/main'
        run: pnpm build

      - name: Unit tests
        if: github.event_name == 'pull_request'
        run: pnpm test:affected

      - name: Unit tests
        if: github.ref == 'refs/heads/main'
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report test results
        uses: mikepenz/action-junit-report@v6.4.0
        if: always()
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results
          include_passed: true

  compile-binaries:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2.0.2

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Compile binaries
        run: pnpm exec nx run cli:compile

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.0
        with:
          name: axm-binaries-${{ github.sha }}
          path: packages/cli/dist/bin/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

  binary-smoke:
    needs: compile-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: axm-linux-x64
          - os: ubuntu-24.04-arm
            binary_name: axm-linux-arm64
          - os: macos-latest
            binary_name: axm-darwin-arm64
          - os: macos-15-intel
            binary_name: axm-darwin-x64
          - os: windows-latest
            binary_name: axm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: axm-binaries-${{ github.sha }}
          path: binaries

      - name: Make binary executable
        if: runner.os != 'Windows'
        run: chmod +x binaries/${{ matrix.binary_name }}

      - name: Smoke test compiled binary
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/binaries/${{ matrix.binary_name }}
        run: pnpm exec nx run cli-e2e:binary-smoke
