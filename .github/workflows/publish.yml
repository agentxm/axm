name: Release
run-name: Release - ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  actions: read
  contents: write
  id-token: write

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: "static"
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag and commit
        id: release_meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="$(scripts/validate-release-tag.sh "$tag")"
          sha="$(git rev-list -n 1 "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download release binaries from CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-ci-binaries.sh "${{ steps.release_meta.outputs.sha }}" release-assets

      - name: Validate release asset set
        run: scripts/validate-release-assets.sh release-assets

      - name: Attach binaries to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release_meta.outputs.tag }}" release-assets/* --clobber

      # Temporary: disable npm publishing while npmjs is unavailable.
      # Keep the step intact so re-enabling it is just removing this guard.
      - name: Publish npm packages (disabled)
        if: ${{ false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm exec nx release publish --outputStyle=static

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi

          git clone \
            --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/agentxm/homebrew-tap.git" \
            ../homebrew-tap

          HOMEBREW_TAP_DIR=../homebrew-tap \
          scripts/update-homebrew-formula.sh "${{ steps.release_meta.outputs.version }}"

  install-verify:
    name: Installer Verification - ${{ matrix.os }} - ${{ matrix.mode }}
    needs: release
    if: ${{ needs.release.result == 'success' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: bash
          - os: macos-latest
            mode: bash
          - os: windows-latest
            mode: powershell
          - os: windows-latest
            mode: cmd
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6.1.0
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run installer verification
        env:
          AXM_INSTALL_TEST_MODE: ${{ matrix.mode }}
          AXM_INSTALL_BASE_URL: https://github.com/agentxm/axm/releases/latest/download
        run: pnpm exec nx run cli-e2e:install-verification

      - name: Upload installer verification artifacts
        uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: install-verification-${{ matrix.os }}-${{ matrix.mode }}
          path: test-results/cli-e2e-install/
          if-no-files-found: ignore
          retention-days: 14

  brew-verify:
    name: Verify Homebrew Install
    needs: release
    if: ${{ needs.release.result == 'success' }}
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Remove existing Homebrew install
        run: |
          brew uninstall axm || true
          brew untap agentxm/tap || true

      - name: Install from Homebrew tap
        run: brew install agentxm/tap/axm

      - name: Verify installed axm version
        run: axm --version

      - name: Clean up Homebrew install
        if: always()
        run: |
          brew uninstall axm || true
          brew untap agentxm/tap || true
