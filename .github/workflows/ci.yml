name: CI

run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI - PR #{0}', github.event.pull_request.number) ||
    format('CI - {0}', github.ref_name)
  }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: static
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"
  NX_PARALLEL: "2"
  VITEST_MAX_WORKERS: "2"

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.set-shas.outputs.base }}
      code: ${{ steps.classify.outputs.code }}
      documentation: ${{ steps.classify.outputs.documentation }}
      head: ${{ steps.set-shas.outputs.head }}
      workflow: ${{ steps.classify.outputs.workflow }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          install: "false"

      - name: Find broad affected fallback
        id: affected-fallback
        run: echo "sha=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Derive affected SHAs
        id: set-shas
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          fallback-sha: ${{ steps.affected-fallback.outputs.sha }}
          main-branch-name: main

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ steps.set-shas.outputs.base }}
          HEAD_SHA: ${{ steps.set-shas.outputs.head }}
        run: >-
          pnpm --config.verify-deps-before-run=warn run classify:ci --
          --base "$BASE_SHA" --head "$HEAD_SHA"

  specification-verdict:
    name: Specification verdict
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Render the per-change specification verdict
        env:
          NX_BASE: ${{ needs.classify.outputs.base }}
        run: pnpm exec nx run axm:specification-verdict -- --base "$NX_BASE" | tee -a "$GITHUB_STEP_SUMMARY"

  extension-lint:
    name: AXM extension lint
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Lint bundled AXM skill
        run: pnpm exec nx run axm:lint-bundled-skill --outputStyle=static

  documentation:
    name: Documentation integrity
    needs: classify
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify changed documentation patch integrity
        env:
          BASE_SHA: ${{ needs.classify.outputs.base }}
          HEAD_SHA: ${{ needs.classify.outputs.head }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" -- '*.md' '*.mdx'

  workflow-validation:
    name: Workflow validation
    needs: classify
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install checksum-verified actionlint
        run: |
          version=1.7.12
          asset="actionlint_${version}_linux_amd64.tar.gz"
          release="https://github.com/rhysd/actionlint/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output "$asset" "$release/$asset"
          curl --fail --location --silent --show-error --output checksums.txt "$release/actionlint_${version}_checksums.txt"
          grep " ${asset}$" checksums.txt | sha256sum --check --strict
          tar --extract --gzip --file "$asset" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Validate workflow syntax
        run: actionlint

  verify-pr:
    name: Verify PR
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          install: "false"

      - name: Create local main ref for release detection
        run: git fetch --no-tags origin main:main

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          key: axm-ci-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            axm-ci-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Nx cache
        id: nx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/axm-ci-cache/nx
          key: >-
            axm-ci-nx-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('mise.toml', '.github/actions/setup-workspace/action.yml') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
            github.event.pull_request.head.sha }}
          restore-keys: |
            axm-ci-nx-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', '.github/actions/setup-workspace/action.yml') }}-${{ hashFiles('pnpm-lock.yaml') }}-
            axm-ci-nx-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', '.github/actions/setup-workspace/action.yml') }}-
            axm-ci-nx-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Determine release verification mode
        id: release-mode
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ needs.classify.outputs.head }}
        run: |
          release_preparation=false
          release_subject="release: ${HEAD_REF#release/}"
          if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] &&
            [[ "$HEAD_REF" =~ ^release/cli-v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] &&
            git log --format=%s "main..$HEAD_SHA" | grep --fixed-strings --line-regexp --quiet -- "$release_subject"; then
            release_preparation=true
          fi
          echo "release_preparation=$release_preparation" >> "$GITHUB_OUTPUT"

      - name: Verify affected changes
        id: verify
        env:
          pnpm_config_store_dir: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          NX_CACHE_DIRECTORY: ${{ runner.temp }}/axm-ci-cache/nx
          NX_PARALLEL: "3"
          VITEST_MAX_WORKERS: "2"
          AXM_RELEASE_PREPARATION: ${{ steps.release-mode.outputs.release_preparation }}
          NX_BASE: ${{ needs.classify.outputs.base }}
          NX_HEAD: ${{ needs.classify.outputs.head }}
        run: |
          pnpm install --frozen-lockfile
          if [[ "$AXM_RELEASE_PREPARATION" != "true" ]]; then
            pnpm release:plan:check
          fi
          pnpm run verify:pr:report

      - name: Publish verification summary
        if: always()
        env:
          NX_CACHE_HIT: ${{ steps.nx-cache.outputs.cache-hit }}
          NX_CACHE_PATH: ${{ runner.temp }}/axm-ci-cache/nx
          PNPM_CACHE_HIT: ${{ steps.pnpm-cache.outputs.cache-hit }}
          PNPM_CACHE_PATH: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          cache_status() {
            case "$1" in
              true) printf 'Exact hit' ;;
              false) printf 'Fallback hit' ;;
              *) printf 'Miss' ;;
            esac
          }
          cache_size() {
            if [[ -d "$1" ]]; then
              du -sh "$1" | cut -f1
            else
              printf '0 B'
            fi
          }
          verify_outcome=${VERIFY_OUTCOME:-not run}
          {
            echo "## Hosted PR verification"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Outcome | $verify_outcome |"
            echo "| pnpm cache | $(cache_status "$PNPM_CACHE_HIT") ($(cache_size "$PNPM_CACHE_PATH")) |"
            echo "| Nx cache | $(cache_status "$NX_CACHE_HIT") ($(cache_size "$NX_CACHE_PATH")) |"
            echo "| Concurrency | Nx 3; Vitest 2 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-pr
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-pr
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results
          include_passed: true

  verify-main:
    name: Verify main workspace
    needs: classify
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Clear prior workspace evidence
        run: rm -rf "$GITHUB_WORKSPACE/test-results"

      - name: Verify workspace
        id: verify
        env:
          NX_PARALLEL: "2"
          VITEST_MAX_WORKERS: "2"
        run: pnpm run ci:workspace:report

      - name: Publish workspace verification summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## Hosted workspace verification"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Outcome | ${VERIFY_OUTCOME:-not run} |"
            echo "| Scope | Clean checkout, formatting, lint, typecheck, build, and unit tests |"
            echo "| Concurrency | Nx 2; Vitest 2 |"
            echo "| Cache | Fresh hosted workspace |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit artifacts
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-main-workspace
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-main-workspace
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always() && steps.verify.outcome != 'skipped'
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Workspace Test Results
          include_passed: true

  verify-e2e-main:
    name: Verify CLI E2E - ${{ matrix.name }}
    needs: classify
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: main-1
            name: main shard 1/2
            command: pnpm exec nx run cli-e2e:e2e-main --outputStyle=static -- --shard=1/2
          - id: main-2
            name: main shard 2/2
            command: pnpm exec nx run cli-e2e:e2e-main --outputStyle=static -- --shard=2/2
          - id: distribution
            name: binary and install distribution
            command: pnpm exec nx run-many --projects cli-e2e -t binary-smoke install-suite --nxBail --outputStyle=static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Clear prior workspace evidence
        run: rm -rf "$GITHUB_WORKSPACE/test-results"

      - name: Verify fresh CLI E2E partition
        id: verify
        env:
          NX_PARALLEL: "3"
          VITEST_MAX_WORKERS: "4"
          AXM_E2E_COMMAND: ${{ matrix.command }}
        run: scripts/with-allure-report.sh bash -lc "$AXM_E2E_COMMAND"

      - name: Publish E2E verification summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## CLI E2E verification — ${{ matrix.name }}"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Outcome | ${VERIFY_OUTCOME:-not run} |"
            echo "| Freshness | Leaf E2E targets are non-cacheable; build prerequisites may be reused |"
            echo "| Concurrency | Three hosted partitions; Vitest 4 within each main shard |"
            echo "| Cache | Nx retains only reusable prerequisite work |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit artifacts
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-main-e2e-${{ matrix.id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-main-e2e-${{ matrix.id }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always() && steps.verify.outcome != 'skipped'
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: CLI E2E Test Results (${{ matrix.name }})
          include_passed: true

  windows-workspace:
    name: Windows workspace lifecycle
    needs: classify
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Verify Windows instruction fallback
        run: pnpm nx run workspace-projection:test-windows --outputStyle=static

      - name: Verify Windows workspace mutations
        env:
          # This lifecycle target builds the portable JS CLI; dedicated main E2E
          # partitions own compiled-host coverage.
          AXM_E2E_CLI_SOURCE: built
        run: pnpm nx run cli-e2e:e2e-windows --outputStyle=static

      - name: Verify published-package launcher isolation
        run: pnpm exec nx run axm:test --args="verify-installed-package.test.ts" --outputStyle=static

      - name: Generate Windows Allure report
        if: always()
        run: pnpm exec nx run axm:allure-report --outputStyle=static

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows-workspace-${{ github.sha }}
          path: |
            test-results/workspace-projection-windows/
            test-results/cli-e2e-windows/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-windows-workspace-${{ github.sha }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Windows JUnit report
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "test-results/*-windows/junit.xml"
          check_name: Windows Workspace Test Results
          include_passed: true

  binary-smoke:
    name: Binary Smoke - ${{ matrix.os }}
    needs: classify
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: axm-linux-x64
          - os: ubuntu-24.04-arm
            binary_name: axm-linux-arm64
          - os: macos-latest
            binary_name: axm-darwin-arm64
          - os: macos-15-intel
            binary_name: axm-darwin-x64
          - os: windows-latest
            binary_name: axm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Compile host binary
        run: pnpm exec nx run cli:compile-host --outputStyle=static

      - name: Mark binary executable
        if: runner.os != 'Windows'
        run: chmod +x apps/cli/dist/host-bin/${{ matrix.binary_name }}

      - name: Run binary smoke test
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/apps/cli/dist/host-bin/${{ matrix.binary_name }}
        run: pnpm exec nx run cli-e2e:binary-smoke-artifact --outputStyle=static

      - name: Generate Allure report
        if: always()
        run: pnpm exec nx run axm:allure-report --outputStyle=static

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-binary-${{ matrix.binary_name }}-${{ github.sha }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compiled binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axm-binary-${{ matrix.binary_name }}-${{ github.sha }}
          path: apps/cli/dist/host-bin/${{ matrix.binary_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  npm-cohort:
    name: Produce verified npm cohort
    needs: classify
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Pack and verify the fixed npm cohort once
        run: >-
          pnpm exec nx run axm:produce-release-cohort --outputStyle=static --
          "$GITHUB_SHA" release-npm

      - name: Upload exact npm cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axm-npm-cohort-${{ github.sha }}
          path: release-npm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  required:
    name: Required CI
    if: always()
    needs:
      - classify
      - specification-verdict
      - extension-lint
      - documentation
      - workflow-validation
      - verify-pr
      - verify-main
      - verify-e2e-main
      - windows-workspace
      - binary-smoke
      - npm-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          RESULTS: >-
            ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          DOCS_CHANGED: ${{ needs.classify.outputs.documentation }}
          WORKFLOW_CHANGED: ${{ needs.classify.outputs.workflow }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            expected=(classify specification-verdict extension-lint verify-pr windows-workspace)
            [[ "$DOCS_CHANGED" == "true" ]] && expected+=(documentation)
            [[ "$WORKFLOW_CHANGED" == "true" ]] && expected+=(workflow-validation)
          else
            expected=(classify verify-main verify-e2e-main windows-workspace binary-smoke npm-cohort)
          fi
          expected_failures=""
          for job in "${expected[@]}"; do
            result=$(jq -r --arg job "$job" '.[$job].result // "missing"' <<<"$RESULTS")
            if [[ "$result" != "success" ]]; then
              expected_failures+="- \`$job\`: $result"$'\n'
            fi
          done
          failures=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "- `\(.key)`: \(.value.result)"
          ' <<<"$RESULTS")
          failures="${expected_failures}${failures}"
          if [[ -n "$failures" ]]; then
            {
              echo "## Required CI failures"
              echo
              printf '%s\n' "$failures"
            } >> "$GITHUB_STEP_SUMMARY"
            failure_count=$(wc -l <<<"$failures" | tr -d ' ')
            echo "::error title=Required CI failed::${failure_count} applicable job(s) did not succeed"
            exit 1
          fi
          {
            echo "## Required CI"
            echo
            echo "All applicable jobs succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
