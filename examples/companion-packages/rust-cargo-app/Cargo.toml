[package]
name = "agentxm-example-pawmatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "PawMatch CLI — example consumer of agentxm-example-tinyflags."
license = "MIT"
publish = false

[lib]
name = "pawmatch"
path = "src/lib.rs"

[[bin]]
name = "pawmatch"
path = "src/main.rs"

[dependencies]
agentxm-example-tinyflags = { path = "../rust-cargo-lib", version = "0.1.0" }
