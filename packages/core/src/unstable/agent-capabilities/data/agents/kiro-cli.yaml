# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: kiro-cli
name: Kiro CLI
vendor: AWS
homepage: https://kiro.dev
interfaces:
  - cli
family: amazon
docs:
  - label: Kiro CLI documentation
    url: https://kiro.dev/docs/cli/
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .kiro/skills
  sources:
    - https://kiro.dev/docs/cli/skills/
  lastVerified: 2026-05-20
mcp:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  transports:
    - stdio
    - http
  config:
    serversKey: mcpServers
    nativeEnabled: true
    targets:
      - scope: project
        path: .kiro/settings/mcp.json
        format: json
      - scope: user
        path: ~/.kiro/settings/mcp.json
        format: json
    stdio:
      command: split
      envKey: env
    remote:
      typeField:
        name: type
        value:
          streamable-http: http
          sse: http
      urlKey:
        streamable-http: url
        sse: url
  sources:
    - https://kiro.dev/docs/cli/mcp/
  lastVerified: 2026-05-20
subagents:
  notes: No industry spec for subagents yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://kiro.dev/docs/cli/custom-agents/configuration-reference/
  lastVerified: 2026-05-20
  directory: .kiro/agents
  layout: directory
instructions:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  files:
    - AGENTS.md
  nestedDiscovery: true
  sources:
    - https://kiro.dev/docs/cli/steering/
  lastVerified: 2026-05-20
  kind: agents-md
rules:
  notes: No industry spec for rule files yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  directory: .kiro/steering
  sources:
    - https://kiro.dev/docs/cli/steering/
  lastVerified: 2026-05-20
rootDir: .kiro
commands:
  notes: No industry spec for slash commands yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://kiro.dev/docs/cli/
  lastVerified: 2026-05-20
  directory: .kiro/prompts
