  prettier: ^3.9.10
  semver: ^7.8.5
  simple-git: ^4.0.1
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-eslint: ^8.71.2
  vite: ^8.3.4
  vitest: ^5.0.5
  yaml: ^2.9.1
  eslint-plugin-boundaries: 7.2.0
  dependency-cruiser: 18.6.0
  eslint-import-resolver-typescript: 4.4.5
  "@boundaries/elements": 3.1.1

allowBuilds:
  # Platform bindings are supplied by optional packages; no fallback download.
  unrs-resolver: false
  "@swc/core": true
  esbuild: true
  msgpackr-extract: false
  nx: true

minimumReleaseAge: 1440
