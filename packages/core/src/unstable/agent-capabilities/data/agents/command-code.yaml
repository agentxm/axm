# yaml-language-server: $schema=../../agent.schema.json
id: command-code
name: Command Code
vendor: Command Code
homepage: https://commandcode.ai
interfaces:
  - cli
docs:
  - label: Command Code documentation
    url: https://commandcode.ai/docs
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .commandcode/skills
  sources:
    - https://commandcode.ai/docs/skills
  lastVerified: 2026-05-20
commands:
  scopes:
    - user
    - project
  directory: .commandcode/commands
  notes: >
    Skills are also surfaced in Command Code's slash menu; custom commands and skills share the same
    invocation surface.
  sources:
    - https://commandcode.ai/docs/skills
  lastVerified: 2026-05-20
mcp:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  transports:
    - stdio
    - http
    - sse
  config:
    serversKey: mcpServers
    nativeEnabled: true
    targets:
      - scope: project
        path: .commandcode/mcp.json
        format: json
      - scope: user
        path: ~/.commandcode/mcp.json
        format: json
    stdio:
      command: split
      envKey: env
    remote:
      typeField:
        name: type
        value:
          streamable-http: http
          sse: sse
      urlKey:
        streamable-http: url
        sse: url
      headersKey: headers
  sources:
    - https://commandcode.ai/features
  lastVerified: 2026-05-20
rootDir: .commandcode
