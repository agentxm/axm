schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  proposal:
    - focus on the functional behavior and interaction patterns of the API or feature, not the implementation details
    - backward compatability is a non-goal
  design:
    - backward compatability is a non-goal
    - should always require linting to pass
  tasks:
    - "TDD: add (design) or update tests prior to implementation step: red, green, refactor until a good design"
    - "Add a typecheck verification steps immediatly proceeding any implementation task, fix any issues found"
    - "Add step to fix any typecheck errors after every task"
    - "Add step to fix any linting errors after every task"
    - "Add step to fix any testing errors after every task"
    - "Add a step to kill any vitest worker processes after testing verification"
