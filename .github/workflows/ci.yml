name: CI
run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI - PR #{0}', github.event.pull_request.number) ||
    format('CI - {0}', github.ref_name)
  }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  verify:
    name: Verify Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create local main ref for affected/base diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:main

      - name: Check release plan
        if: github.event_name == 'pull_request'
        run: pnpm release:plan:check

      - name: Check Nx sync
        run: pnpm exec nx sync:check

      - name: Check formatting
        run: pnpm exec nx format:check

      - name: Type check
        run: pnpm exec nx run-many -t typecheck

      - name: Lint
        run: pnpm exec nx run-many -t lint

      - name: Build
        run: pnpm exec nx run-many -t build

      - name: Test
        run: pnpm exec nx run-many -t test

      - name: E2E tests
        run: pnpm exec nx run-many -t e2e

      - name: Lint scripts
        run: pnpm exec nx run axm:scripts-lint

      - name: Type check scripts
        run: pnpm exec nx run axm:scripts-typecheck

      - name: Test scripts
        run: pnpm exec nx run axm:scripts-test

      - name: Verify E2E boundaries
        run: pnpm exec nx run axm:verify-e2e-boundaries

      - name: Upload JUnit artifacts
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6.4.0
        if: always()
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results
          include_passed: true

  binary-smoke:
    name: Binary Smoke - ${{ matrix.os }}
    needs: verify
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: axm-linux-x64
          - os: ubuntu-24.04-arm
            binary_name: axm-linux-arm64
          - os: macos-latest
            binary_name: axm-darwin-arm64
          - os: macos-15-intel
            binary_name: axm-darwin-x64
          - os: windows-latest
            binary_name: axm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile host binary
        run: pnpm exec nx run cli:compile --outputStyle=static -- --host-only

      - name: Mark binary executable
        if: runner.os != 'Windows'
        run: chmod +x packages/cli/dist/bin/${{ matrix.binary_name }}

      - name: Run binary smoke test
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/packages/cli/dist/bin/${{ matrix.binary_name }}
        run: pnpm exec nx run cli-e2e:binary-smoke-artifact --outputStyle=static

      - name: Upload compiled binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: axm-binary-${{ matrix.binary_name }}-${{ github.sha }}
          path: packages/cli/dist/bin/${{ matrix.binary_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
