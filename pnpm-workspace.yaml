  "@effect/language-service": ^0.87.5
  "@effect/openapi-generator": 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/platform-node-shared": 4.0.5
  "@effect/tsgo": ^0.53.3
  "@effect/vitest": 4.0.5
  "@eslint/js": ^10.0.0
  "@nx/devkit": 23.3.0
  "@nx/eslint": 23.3.0
  "@nx/eslint-plugin": 23.3.0
  "@nx/js": 23.3.0
  "@nx/vitest": 23.3.0
  "@swc-node/register": ^1.12.1
