name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: "static"
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@v5

      - uses: oven-sh/setup-bun@v2.0.2

      - run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5.0.1

      - name: Release plan check
        if: github.event_name == 'pull_request'
        run: pnpm release:plan:check

      - name: CI (affected)
        if: github.event_name == 'pull_request'
        run: pnpm run ci:affected

      - name: CI
        if: github.ref == 'refs/heads/main'
        run: pnpm run ci

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report test results
        uses: mikepenz/action-junit-report@v6.4.0
        if: always()
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results
          include_passed: true

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.0
        with:
          name: axm-binaries-${{ github.sha }}
          path: packages/cli/dist/bin/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

  binary-smoke:
    needs: verify
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: axm-linux-x64
          - os: ubuntu-24.04-arm
            binary_name: axm-linux-arm64
          - os: macos-latest
            binary_name: axm-darwin-arm64
          - os: macos-15-intel
            binary_name: axm-darwin-x64
          - os: windows-latest
            binary_name: axm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@v5

      - uses: oven-sh/setup-bun@v2.0.2

      - run: pnpm install --frozen-lockfile

      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: axm-binaries-${{ github.sha }}
          path: binaries

      - name: Make binary executable
        if: runner.os != 'Windows'
        run: chmod +x binaries/${{ matrix.binary_name }}

      - name: Smoke test compiled binary
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/binaries/${{ matrix.binary_name }}
        run: pnpm exec nx run cli-e2e:binary-smoke-artifact --outputStyle=static
