schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  proposal:
    - focus on the functional behavior and interaction patterns of the API or feature, not the implementation details
    - backward compatability is a non-goal
  design:
    - backward compatability is a non-goal
    - should always require linting to pass
  tasks:
    - "TDD: add (design) or update tests prior to implementation step: red, green, refactor until a good design"
    - "Add a typecheck verification step immediately after any implementation task, fix any issues found"
    - "Add step to run typecheck for all packages (`pnpm typecheck`) after every task group, fix any errors"
    - "Add step to run linting for all packages (`pnpm lint`) after every task group, fix any errors"
    - "Add step to run tests for all packages (`pnpm test`) after every task group, fix any failures"
    - "Add step to run relevant e2e tests (`pnpm test:e2e`) after every task group, fix any failures"
    - "Add a step to kill any vitest worker processes after testing verification"
    - "Ensure all phases clearly specify any dependent/predecessor phases and/or what phases can be worked in parallel"
    - >-
      Begin the task document with a top-level blockquote directive:
      `> **Orchestration:** The main agent thread MUST NOT execute any tasks directly.
      Delegate each phase to subagents as directed below. The main agent's role is strictly
      to orchestrate: launch subagents, verify phase completion, and proceed to the next phase.`
    - >-
      Each phase MUST be delegated to a single subagent by default. Mark each phase heading with
      `> **Subagent:** Run this entire phase in a single subagent.` as a blockquote directive.
      If independent tasks within a phase can be further parallelized (e.g. migrating unrelated files),
      add a `> **Parallelization:** Tasks X.Y, X.Z, X.W are independent — launch as parallel subagents.`
      directive listing the specific tasks.
