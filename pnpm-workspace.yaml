packages:
  - apps/*
  - packages/*/*
  - tools/*

# Standalone producers cross-compile these five release targets. Their optional
# native addons must be installed even when the producer runs on another host.
supportedArchitectures:
  - darwin-arm64
  - darwin-x64
  - linux-arm64
  - linux-x64
  - win32-x64

verifyDepsBeforeRun: error
# mise owns the pnpm version; keep the lockfile as one document for dependency graph readers.
pmOnFail: ignore

