# yaml-language-server: $schema=../../agent.schema.json
id: kode
name: Kode
vendor: shareAI-lab
homepage: https://github.com/shareAI-lab/Kode-Agent
interfaces: [cli]
docs:
  - label: Kode Agent repository
    url: https://github.com/shareAI-lab/Kode-Agent

skills:
  support: standard
  scopes: [user, project]
  directory: .kode/skills
  sources:
    - https://github.com/shareAI-lab/Kode-Agent
  lastVerified: 2026-05-20

subagents:
  support: bridged
  scopes: [user, project]
  sources:
    - https://github.com/shareAI-lab/Kode-Agent
  lastVerified: 2026-05-20

instructions:
  support: standard
  scopes: [project]
  files: [AGENTS.md, AGENTS.override.md, CLAUDE.md]
  nestedDiscovery: true
  sources:
    - https://github.com/shareAI-lab/Kode-Agent
  lastVerified: 2026-05-20

permissions:
  support: standard
  scopes: [user, project]
  mechanism: [cli-flag]
  cliFlags:
    - flag: "--safe"
      note: Enables permission checks instead of Kode's default YOLO mode.
    - flag: "--dangerously-skip-permissions"
      note: Explicitly bypasses permission checks.
  sources:
    - https://github.com/shareAI-lab/Kode-Agent
  lastVerified: 2026-05-20
