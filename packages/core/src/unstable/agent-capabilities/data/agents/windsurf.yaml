# yaml-language-server: $schema=../../agent.schema.json
id: windsurf
name: Windsurf
vendor: Cognition
homepage: https://windsurf.com
interfaces: [ide-extension]
family: cognition
docs:
  - label: Windsurf documentation
    url: https://docs.windsurf.com

mcp:
  support: standard
  scopes: [user, project]
  transports: [stdio]
  sources:
    - https://docs.windsurf.com/windsurf/cascade/mcp
  lastVerified: 2026-05-16

instructions:
  support: standard
  scopes: [project]
  files: [AGENTS.md]
  nestedDiscovery: true
  sources:
    - https://docs.windsurf.com/windsurf/cascade/agents-md
  lastVerified: 2026-05-16

rules:
  support: bridged
  scopes: [user, project]
  directory: .windsurf/rules
  sources:
    - https://docs.windsurf.com/windsurf/cascade/rules
  lastVerified: 2026-05-16

permissions:
  support: standard
  scopes: [user]
  mechanism: [config-file, ui-only]
  configFiles:
    - scope: user
      path: VS Code settings (Settings UI)
      format: vscode-settings
  grammar:
    style: prefix
    example: axm
    notes: >
      windsurf.cascadeCommandsAllowList is prefix-matched. Workspace-scoped
      override for these keys is not documented; configure at user scope.
      Teams/Enterprise can merge in lists via the Admin Portal.
  prerequisites:
    - key: Cascade auto-execution level
      value: "allowlist_only | turbo"
      scope: user
      note: Disabled and Auto modes ignore allowlist entries; set via the Windsurf Settings panel.
  grants:
    shell:
      target: VS Code settings
      patch:
        windsurf.cascadeCommandsAllowList:
          - "${tool}"
  sources:
    - https://docs.windsurf.com/windsurf/terminal
    - https://docs.windsurf.com/windsurf/cascade
  lastVerified: 2026-05-18
