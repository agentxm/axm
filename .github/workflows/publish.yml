name: Publish to npm

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm test:e2e

      - run: pnpm --filter ./packages/cli run build

      - run: pnpm --filter ./packages/cli publish --provenance --access public --no-git-checks
