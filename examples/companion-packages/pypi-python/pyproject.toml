[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentxm-example-tinyflags"
version = "0.1.0"
description = "Tiny feature flags library used by AXM companion package examples."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["feature-flags", "tinyflags", "agentxm"]

[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentxm_example_tinyflags"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.axm]
recommendedExtensions = ["@examples/packs/pypi-python-tinyflags@^0.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP", "RUF", "SIM", "PT", "PERF"]

[tool.ruff.format]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
