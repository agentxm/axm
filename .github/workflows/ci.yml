name: CI
run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI - PR #{0}', github.event.pull_request.number) ||
    format('CI - {0}', github.ref_name)
  }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "contributing/**"
      - "*.md"
      - ".github/pull_request_template.md"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  checks: write
  contents: read

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: static
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"

jobs:
  verify:
    name: Verify Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Create local main ref for affected/base diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:main

      - name: Classify pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=true

          while IFS= read -r -d '' path; do
            if [[ "$path" == contributing/* ]] ||
              [[ "$path" != */* && "$path" == *.md ]] ||
              [[ "$path" == ".github/pull_request_template.md" ]]; then
              continue
            fi

            docs_only=false
            break
          done < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA")

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release plan
        if: github.event_name == 'pull_request' &&
          steps.changes.outputs.docs_only != 'true'
        run: pnpm release:plan:check

      - name: Verify affected pull request changes
        if: github.event_name == 'pull_request' &&
          steps.changes.outputs.docs_only != 'true'
        run: pnpm run ci:affected

      - name: Verify documentation
        if: github.event_name == 'pull_request' &&
          steps.changes.outputs.docs_only == 'true'
        run: pnpm run format:check

      - name: Verify main
        if: github.event_name == 'push'
        run: pnpm run ci

      - name: Upload JUnit artifacts
        uses: actions/upload-artifact@v7.0.1
        if: always() && steps.changes.outputs.docs_only != 'true'
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6.4.0
        if: always() && steps.changes.outputs.docs_only != 'true'
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results
          include_passed: true

  binary-smoke:
    name: Binary Smoke - ${{ matrix.os }}
    needs: verify
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: axm-linux-x64
          - os: ubuntu-24.04-arm
            binary_name: axm-linux-arm64
          - os: macos-latest
            binary_name: axm-darwin-arm64
          - os: macos-15-intel
            binary_name: axm-darwin-x64
          - os: windows-latest
            binary_name: axm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile host binary
        run: pnpm exec nx run cli:compile --outputStyle=static -- --host-only

      - name: Mark binary executable
        if: runner.os != 'Windows'
        run: chmod +x packages/cli/dist/bin/${{ matrix.binary_name }}

      - name: Run binary smoke test
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/packages/cli/dist/bin/${{ matrix.binary_name }}
        run: pnpm exec nx run cli-e2e:binary-smoke-artifact --outputStyle=static

      - name: Upload compiled binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: axm-binary-${{ matrix.binary_name }}-${{ github.sha }}
          path: packages/cli/dist/bin/${{ matrix.binary_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
