name: CI

run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI - PR #{0}', github.event.pull_request.number) ||
    github.event_name == 'merge_group' &&
    format('CI - merge group {0}', github.ref_name) ||
    format('CI - {0}', github.ref_name)
  }}

on:
  pull_request:
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch:

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  actions: read
  contents: read

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: static
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"
  NX_SKIP_NX_CACHE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
  NX_SKIP_REMOTE_CACHE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
  NX_PARALLEL: "2"
  VITEST_MAX_WORKERS: "2"

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.set-shas.outputs.base }}
      code: ${{ steps.classify.outputs.code }}
      documentation: ${{ steps.classify.outputs.documentation }}
      cli-e2e: ${{ steps.classify.outputs.cli_e2e }}
      release-artifacts: ${{ steps.classify.outputs.release_artifacts }}
      release-preparation: ${{ steps.classify.outputs.release_preparation }}
      required-jobs: ${{ steps.classify.outputs.required_jobs }}
      specification-verdict: ${{ steps.classify.outputs.specification_verdict }}
      extension-lint: ${{ steps.classify.outputs.extension_lint }}
      selection: ${{ steps.classify.outputs.selection }}
      windows: ${{ steps.classify.outputs.windows }}
      workflow: ${{ steps.classify.outputs.workflow }}
      workflow-security: ${{ steps.classify.outputs.workflow_security }}
      head: ${{ steps.set-shas.outputs.head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}
          install: "false"

      - name: Find broad affected fallback
        id: affected-fallback
        run: echo "sha=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Derive non-queue affected SHAs
        id: nx-shas
        if: github.event_name != 'merge_group'
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          fallback-sha: ${{ steps.affected-fallback.outputs.sha }}
          main-branch-name: main

      # A rebase queue entry can contain several commits. Its final parent is
      # not the comparison base for the complete proposed integration.
      - name: Select complete affected range
        id: set-shas
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          NX_BASE_SHA: ${{ steps.nx-shas.outputs.base }}
          NX_HEAD_SHA: ${{ steps.nx-shas.outputs.head }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            base="$QUEUE_BASE_SHA"
            head="$QUEUE_HEAD_SHA"
          else
            base="$NX_BASE_SHA"
            head="$NX_HEAD_SHA"
          fi
          test -n "$base"
          test -n "$head"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Classify changed paths and publish the selection contract
        id: classify
        env:
          BASE_SHA: ${{ steps.set-shas.outputs.base }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ steps.set-shas.outputs.head }}
          REF_NAME: ${{ github.ref }}
        run: |
          pnpm --config.verify-deps-before-run=warn run classify:ci -- \
            --base "$BASE_SHA" --head "$HEAD_SHA"

  commit-history:
    name: Commit history
    needs: classify
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}
          install: "false"

      # The queue rebases each commit onto main unchanged, so every commit is
      # reviewed as permanent public history. A pull-request checkout is the
      # synthetic merge of its base (first parent) and source (second parent).
      - name: Check commits that will land on main
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            base="$QUEUE_BASE_SHA"
            head="$(git rev-parse HEAD)"
          else
            base="$(git rev-parse HEAD^1)"
            head="$(git rev-parse HEAD^2)"
          fi
          pnpm --config.verify-deps-before-run=warn run check:commit-history -- \
            --base "$base" --head "$head"

  workflow-validation:
    name: Workflow security
    needs: classify
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.classify.outputs.workflow-security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflow security with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          config: .github/zizmor.yml
          min-severity: medium
          version: "1.30.0"

  specification-verdict:
    name: Specification verdict
    needs: classify
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.classify.outputs.specification-verdict == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}

      - name: Render the per-change specification verdict
        env:
          NX_BASE: ${{ needs.classify.outputs.base }}
        run: pnpm exec nx run axm:specification-verdict -- --base "$NX_BASE" | tee -a "$GITHUB_STEP_SUMMARY"

  extension-lint:
    name: AXM extension lint
    needs: classify
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.classify.outputs.extension-lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}

      - name: Lint bundled AXM skill
        run: pnpm exec nx run axm:lint-bundled-skill --outputStyle=static

  documentation:
    name: Documentation integrity
    needs: classify
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify changed documentation patch integrity
        env:
          BASE_SHA: ${{ needs.classify.outputs.base }}
          HEAD_SHA: ${{ needs.classify.outputs.head }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" -- '*.md' '*.mdx'

  verify-pr:
    name: Verify proposed change - ${{ matrix.partition }}
    needs: classify
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: workspace-features
            exclude: "*,!workspace-features"
          - partition: remaining-projects
            exclude: workspace-features
    permissions:
      checks: write
      contents: read
    env:
      # Give the largest suite both test workers without multiplying nested pools.
      NX_PARALLEL: "1"
      VITEST_MAX_WORKERS: "2"
      NX_BASE: ${{ needs.classify.outputs.base }}
      NX_HEAD: ${{ needs.classify.outputs.head }}
      SOURCE_EXCLUDE: ${{ matrix.exclude }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}
          install: "false"

      - name: Create local main ref for release detection
        run: git fetch --no-tags origin main:main

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          key: axm-ci-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            axm-ci-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frozen dependencies
        id: install
        env:
          pnpm_config_store_dir: ${{ runner.temp }}/axm-ci-cache/pnpm-store
        run: |
          pnpm install --frozen-lockfile
          echo "pnpm_config_store_dir=$pnpm_config_store_dir" >> "$GITHUB_ENV"

      - name: Check release plan
        id: release-plan
        if: needs.classify.outputs.release-preparation != 'true'
        run: pnpm run release:plan:check

      - name: Check repository prerequisites
        id: preflight
        run: |
          # Start one report set for this job; later phases preserve it.
          rm -rf test-results
          pnpm run verify:pr:preflight

      - name: Isolate verification scratch space
        run: |
          verification_tmp="$(mktemp -d "$RUNNER_TEMP/axm-verification.XXXXXX")"
          echo "TMPDIR=$verification_tmp" >> "$GITHUB_ENV"

      - name: Verify affected source
        id: verify
        env:
          NX_PROFILE: test-results/nx-source-profile.json
        run: pnpm run verify:affected --exclude="$SOURCE_EXCLUDE"

      - name: Select verification reporting scope
        id: report-scope
        if: always() && steps.verify.outcome != 'skipped'
        env:
          SOURCE_PARTITION: ${{ matrix.partition }}
        run: |
          selected_test_projects="$(pnpm exec nx show projects --affected --withTarget=test --exclude="$SOURCE_EXCLUDE" --base="$NX_BASE" --head="$NX_HEAD" --json)"
          selected_e2e_projects='[]'
          if [[ "$SOURCE_PARTITION" == 'remaining-projects' ]]; then
            selected_e2e_projects="$(pnpm exec nx show projects --affected --withTarget=e2e --exclude=cli-e2e --base="$NX_BASE" --head="$NX_HEAD" --json)"
          fi
          selected="$(jq -nr --argjson source "$selected_test_projects" --argjson e2e "$selected_e2e_projects" '[ $source, $e2e ] | if all(.[]; type == "array" and all(.[]; type == "string")) then any(.[]; length > 0) else error("Nx must return selected test projects") end')"
          printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"

      - name: Verify installable artifacts
        id: artifacts
        if: matrix.partition == 'remaining-projects'
        env:
          NX_PROFILE: test-results/nx-artifacts-profile.json
        run: pnpm exec nx run axm:verify-artifacts

      - name: Verify remaining affected E2E
        id: e2e
        if: matrix.partition == 'remaining-projects'
        env:
          NX_PROFILE: test-results/nx-e2e-profile.json
        run: pnpm exec nx affected -t e2e --exclude=cli-e2e --nxBail --parallel=1

      - name: Generate verification report
        id: report
        if: always() && steps.verify.outcome != 'skipped' && steps.report-scope.outputs.selected == 'true'
        run: pnpm exec nx run axm:allure-report

      - name: Publish verification summary
        if: always()
        env:
          PNPM_CACHE_HIT: ${{ steps.pnpm-cache.outputs.cache-hit }}
          PNPM_CACHE_PATH: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RELEASE_PLAN_OUTCOME: ${{ steps.release-plan.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifacts.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          SOURCE_PARTITION: ${{ matrix.partition }}
          TESTS_SELECTED: ${{ steps.report-scope.outputs.selected }}
        run: |
          cache_status() {
            case "$1" in
              true) printf 'Exact hit' ;;
              false) printf 'Fallback hit' ;;
              *) printf 'Miss' ;;
            esac
          }
          cache_size() {
            if [[ -d "$1" ]]; then
              du -sh "$1" | cut -f1
            else
              printf '0 B'
            fi
          }
          {
            echo "## Hosted proposed-change verification"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Frozen dependencies | ${INSTALL_OUTCOME:-not-run} |"
            echo "| Release plan | ${RELEASE_PLAN_OUTCOME:-not-run} |"
            echo "| Repository prerequisites | ${PREFLIGHT_OUTCOME:-not-run} |"
            echo "| Affected source | ${VERIFY_OUTCOME:-not-run} |"
            echo "| Source partition | $SOURCE_PARTITION |"
            echo "| Test projects selected | ${TESTS_SELECTED:-not-run} |"
            echo "| Installable artifacts | ${ARTIFACT_OUTCOME:-not-run} |"
            echo "| Remaining E2E | ${E2E_OUTCOME:-not-run} |"
            echo "| Report generation | ${REPORT_OUTCOME:-not-run} |"
            echo "| pnpm cache | $(cache_status "$PNPM_CACHE_HIT") ($(cache_size "$PNPM_CACHE_PATH")) |"
            echo "| Concurrency | Nx $NX_PARALLEL; Vitest $VITEST_MAX_WORKERS |"
            echo "| Affected base | $NX_BASE |"
            echo "| Verified head | $NX_HEAD |"
            echo
            echo 'Step durations separate setup, prerequisite checks, source, artifacts, E2E, and reporting.'
            echo "Completed Nx invocations retain timing/cache profiles in test-results-pr-$SOURCE_PARTITION: nx-source-profile.json, nx-artifacts-profile.json, and nx-e2e-profile.json."
            echo 'Each profile covers its final Nx command; prerequisite checks and whole-job duration remain visible in the steps above.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report all dependency advisories
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm exec nx run axm:audit:report --outputStyle=static

      - name: Upload JUnit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-pr-${{ matrix.partition }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always() && steps.report.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-pr-${{ matrix.partition }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results - ${{ matrix.partition }}
          include_passed: true
          # Dependabot PRs have a read-only token, including maintainer reruns.
          # Keep annotations and job summaries without creating a check run.
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}

  warm-main-caches:
    name: Warm main dependency cache
    # Only the default branch's cache is readable by proposed-change runs.
    # The schedule keeps the store warm if main has no push for seven days.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}
          install: "false"

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          key: axm-ci-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            axm-ci-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install workspace dependencies
        env:
          pnpm_config_store_dir: ${{ runner.temp }}/axm-ci-cache/pnpm-store
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store on main
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          key: axm-ci-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

  verify-main:
    name: Verify main workspace - ${{ matrix.partition }}
    needs: classify
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.classify.outputs.release-artifacts == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: workspace-features
            exclude: "*,!workspace-features"
          - partition: remaining-projects
            exclude: workspace-features
    permissions:
      checks: write
      contents: read
    env:
      NX_PARALLEL: "1"
      VITEST_MAX_WORKERS: "2"
      SOURCE_EXCLUDE: ${{ matrix.exclude }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}

      - name: Clear prior workspace evidence
        run: rm -rf "$GITHUB_WORKSPACE/test-results"

      - name: Isolate verification scratch space
        run: |
          verification_tmp="$(mktemp -d "$RUNNER_TEMP/axm-verification.XXXXXX")"
          echo "TMPDIR=$verification_tmp" >> "$GITHUB_ENV"

      - name: Verify workspace
        id: verify
        run: pnpm run ci:workspace:report --exclude="$SOURCE_EXCLUDE"

      - name: Publish workspace verification summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_PARTITION: ${{ matrix.partition }}
        run: |
          {
            echo "## Hosted workspace verification"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Outcome | ${VERIFY_OUTCOME:-not run} |"
            echo "| Scope | Clean checkout, formatting, lint, typecheck, build, and unit tests |"
            echo "| Source partition | $SOURCE_PARTITION |"
            echo "| Concurrency | Nx $NX_PARALLEL; Vitest $VITEST_MAX_WORKERS |"
            echo "| Cache | Fresh hosted workspace |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit artifacts
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-main-workspace-${{ matrix.partition }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-main-workspace-${{ matrix.partition }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always() && steps.verify.outcome != 'skipped'
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Workspace Test Results - ${{ matrix.partition }}
          include_passed: true

  verify-e2e:
    name: Verify CLI E2E - ${{ matrix.name }}
    needs: classify
    if: >-
      !cancelled() &&
      (((github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.classify.outputs.cli-e2e == 'true') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.classify.outputs.release-artifacts == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: main-1
            name: main shard 1/2
            command: pnpm exec nx run cli-e2e:e2e-main --outputStyle=static -- --shard=1/2
            affected-command: pnpm exec nx affected -t e2e-main --nxBail --outputStyle=static -- --shard=1/2
          - id: main-2
            name: main shard 2/2
            command: pnpm exec nx run cli-e2e:e2e-main --outputStyle=static -- --shard=2/2
            affected-command: pnpm exec nx affected -t e2e-main --nxBail --outputStyle=static -- --shard=2/2
          - id: distribution
            name: binary and install distribution
            command: pnpm exec nx run-many --projects cli-e2e -t binary-smoke install-suite --nxBail --outputStyle=static
            affected-command: pnpm exec nx affected -t binary-smoke install-suite --nxBail --outputStyle=static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}

      - name: Clear prior workspace evidence
        run: rm -rf "$GITHUB_WORKSPACE/test-results"

      - name: Verify fresh CLI E2E partition
        id: verify
        env:
          # Each E2E worker also launches the CLI under test.
          NX_PARALLEL: "2"
          VITEST_MAX_WORKERS: "2"
          NX_BASE: ${{ needs.classify.outputs.base }}
          NX_HEAD: ${{ needs.classify.outputs.head }}
          AXM_E2E_COMMAND: >-
            ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
            matrix.affected-command || matrix.command }}
        run: scripts/with-allure-report.sh bash -lc "$AXM_E2E_COMMAND"

      - name: Publish E2E verification summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## CLI E2E verification — ${{ matrix.name }}"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Outcome | ${VERIFY_OUTCOME:-not run} |"
            echo "| Freshness | Leaf E2E targets are non-cacheable; build prerequisites may be reused |"
            echo "| Concurrency | Three hosted partitions; Vitest 4 within each main shard |"
            echo "| Cache | Nx retains only reusable prerequisite work |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit artifacts
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-e2e-${{ matrix.id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-e2e-${{ matrix.id }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always() && steps.verify.outcome != 'skipped'
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: CLI E2E Test Results (${{ matrix.name }})
          include_passed: true

  windows-workspace:
    name: Windows workspace lifecycle
    needs: classify
    if: >-
      !cancelled() &&
      (((github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.classify.outputs.windows == 'true') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.classify.outputs.release-artifacts == 'true'))
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}

      - name: Verify Windows workspace lifecycle
        env:
          # This lifecycle target builds the portable JS CLI; dedicated main E2E
          # partitions own compiled-host coverage.
          AXM_E2E_CLI_SOURCE: built
          NX_BASE: ${{ needs.classify.outputs.base }}
          NX_HEAD: ${{ needs.classify.outputs.head }}
          WINDOWS_VERIFICATION_COMMAND: >-
            ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
            needs.classify.outputs.workflow != 'true' &&
            'affected' || 'run-many' }}
        run: pnpm exec nx $env:WINDOWS_VERIFICATION_COMMAND -t test-windows e2e-windows --nxBail --parallel=1 --outputStyle=static

      - name: Verify published-package launcher isolation
        run: pnpm exec nx run axm:test --args="verify-installed-package.test.ts" --outputStyle=static

      - name: Generate Windows Allure report
        if: always()
        run: pnpm exec nx run axm:allure-report --outputStyle=static

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows-workspace-${{ github.sha }}
          path: |
            test-results/workspace-windows/
            test-results/cli-e2e-windows/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-windows-workspace-${{ github.sha }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Windows JUnit report
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: "test-results/*-windows/junit.xml"
          check_name: Windows Workspace Test Results
          include_passed: true

  binary-smoke:
    name: Binary Smoke - ${{ matrix.os }}
    timeout-minutes: 25
    needs: classify
    if: >-
      !cancelled() &&
      (needs.classify.outputs.release-artifacts == 'true' ||
      github.event_name == 'workflow_dispatch' ||
       ((github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
        needs.classify.outputs.windows == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compile_target: compile-linux-x64
            binary_name: axm-linux-x64
          - os: ubuntu-24.04-arm
            compile_target: compile-linux-arm64
            binary_name: axm-linux-arm64
          - os: macos-latest
            compile_target: compile-darwin-arm64
            binary_name: axm-darwin-arm64
          - os: macos-15-intel
            compile_target: compile-darwin-x64
            binary_name: axm-darwin-x64
          - os: windows-latest
            compile_target: compile-windows-x64
            binary_name: axm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}

      - name: Compile platform binary
        run: pnpm exec nx run cli:${{ matrix.compile_target }} --outputStyle=static

      - name: Verify native paths on Linux casefold directories
        if: runner.os == 'Linux'
        run: pnpm run verify:linux-casefold

      - name: Verify canonical native paths on macOS
        if: runner.os == 'macOS'
        run: pnpm exec nx run workspace-kernel:test --args="src/locations --maxWorkers=1" --outputStyle=static

      - name: Mark binary executable
        if: runner.os != 'Windows'
        run: chmod +x apps/cli/dist/bin/${{ matrix.binary_name }}

      - name: Run binary smoke test
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/apps/cli/dist/bin/${{ matrix.binary_name }}
          AXM_EXPECT_FILESYSTEM_CASE: ${{ runner.os == 'macOS' && 'insensitive' || '' }}
        run: pnpm exec nx run cli-e2e:binary-smoke-artifact --outputStyle=static

      - name: Verify native lifecycle on case-sensitive APFS
        if: runner.os == 'macOS'
        shell: bash
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/apps/cli/dist/bin/${{ matrix.binary_name }}
          AXM_EXPECT_FILESYSTEM_CASE: sensitive
        run: |
          image="$RUNNER_TEMP/axm-case-sensitive.sparseimage"
          mount="$RUNNER_TEMP/axm-case-sensitive"
          hdiutil create -size 256m -type SPARSE -fs 'Case-sensitive APFS' -volname AXMCaseSensitive "$image"
          mkdir -p "$mount"
          hdiutil attach "$image" -mountpoint "$mount" -nobrowse -plist > "$RUNNER_TEMP/axm-case-sensitive.plist"
          device="$(plutil -extract system-entities.0.dev-entry raw "$RUNNER_TEMP/axm-case-sensitive.plist")"
          [[ "$device" =~ ^/dev/disk[0-9]+$ ]] || exit 1
          ownership_verified=false
          cleanup() {
            status=$?
            trap - EXIT
            echo "::group::Case-sensitive APFS cleanup diagnostics"
            if ! diskutil info "$device"; then
              echo "::warning::Could not inspect the attached APFS device."
            fi
            lsof_status=0
            lsof -nP +f -- "$mount" || lsof_status=$?
            echo "Mount open-file inspection status: $lsof_status (1 may mean no matches)."
            echo "::endgroup::"
            # Release the image's APFS storage layer before its backing device.
            # diskutil(8): apfs deleteContainer removes its volumes and stores.
            if [[ "$ownership_verified" == true ]]; then
              diskutil apfs deleteContainer "$container" || {
                cleanup_status=$?
                if [[ "$status" -eq 0 ]]; then
                  status=$cleanup_status
                fi
              }
            else
              echo "::error::Refusing APFS container deletion without verified image ownership."
              if [[ "$status" -eq 0 ]]; then
                status=1
              fi
            fi
            # A failed eject may already have unmounted the filesystem.
            cleanup_status=0
            hdiutil detach "$device" || cleanup_status=$?
            if [[ "$cleanup_status" -ne 0 ]]; then
              for attempt in 1 2 3 4 5; do
                cleanup_status=0
                hdiutil detach -force "$device" || cleanup_status=$?
                [[ "$cleanup_status" -eq 16 && "$attempt" -lt 5 ]] || break
                echo "Image still busy after container cleanup; retrying detach ($attempt/5)."
                sleep 2
              done
              if [[ "$status" -eq 0 ]]; then
                status=$cleanup_status
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          diskutil info -plist "$mount" > "$RUNNER_TEMP/axm-case-sensitive-volume.plist"
          cat "$RUNNER_TEMP/axm-case-sensitive-volume.plist"
          container="$(plutil -extract APFSContainerReference raw -expect string "$RUNNER_TEMP/axm-case-sensitive-volume.plist")"
          diskutil apfs list -plist "$container" > "$RUNNER_TEMP/axm-case-sensitive-container.plist"
          container_plist="$RUNNER_TEMP/axm-case-sensitive-container.plist"
          cat "$container_plist"
          container_count="$(plutil -extract Containers raw -expect array "$container_plist")"
          listed_container="$(plutil -extract Containers.0.ContainerReference raw -expect string "$container_plist")"
          store_count="$(plutil -extract Containers.0.PhysicalStores raw -expect array "$container_plist")"
          physical_store="$(plutil -extract Containers.0.PhysicalStores.0.DeviceIdentifier raw -expect string "$container_plist")"
          backing_disk="${device#/dev/}"
          echo "APFS ownership readback: device=$device container=$container listed-container=$listed_container containers=$container_count stores=$store_count physical-store=$physical_store"
          if [[ "$container_count" != 1 || "$store_count" != 1 ||
                ! "$container" =~ ^disk[0-9]+$ || "$container" != "$listed_container" ||
                ! "$physical_store" =~ ^${backing_disk}s[0-9]+$ ]]; then
            echo "::error::APFS container does not belong exclusively to the attached test image."
            exit 1
          fi
          ownership_verified=true
          echo "Owned APFS fixture: device=$device container=$container physical-store=$physical_store"
          AXM_NATIVE_FIXTURE_PARENT="$mount" NX_DAEMON=false NX_ISOLATE_PLUGINS=false pnpm exec nx run cli-e2e:binary-smoke-artifact --outputStyle=static --args='-t "preserves native case aliases and remaining Skill consumers"'

      - name: Verify physical boundary exclusion on macOS
        if: runner.os == 'macOS'
        run: pnpm exec nx run workspace-kernel:test --outputStyle=static --args='src/settlement/authorities-refuse-overlapping-physical-boundaries.spec.ts --testTimeout=30000'

      - name: Generate Allure report
        if: always()
        run: pnpm exec nx run axm:allure-report --outputStyle=static

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-binary-${{ matrix.binary_name }}-${{ github.sha }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compiled binary
        if: needs.classify.outputs.release-artifacts == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axm-binary-${{ matrix.binary_name }}-${{ github.sha }}
          path: apps/cli/dist/bin/${{ matrix.binary_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  release-content:
    name: Produce verified release content
    needs: classify
    if: >-
      !cancelled() && needs.classify.outputs.release-artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}

      - name: Produce exact installers and published schemas
        run: pnpm exec nx run axm:produce-release-content --outputStyle=static

      - name: Upload exact release content
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axm-release-content-${{ github.sha }}
          path: release-content/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  npm-cohort:
    name: Produce verified npm cohort
    needs: classify
    if: >-
      !cancelled() && needs.classify.outputs.release-artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}

      - name: Pack and verify the fixed npm cohort once
        run: >-
          pnpm exec nx run axm:produce-release-cohort --outputStyle=static --
          "$GITHUB_SHA" release-npm

      - name: Upload exact npm cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axm-npm-cohort-${{ github.sha }}
          path: release-npm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up workspace and the pinned scanner
        uses: ./.github/actions/setup-workspace
        with:
          remote-cache-bypass: ${{ vars.NX_SKIP_REMOTE_CACHE }}
          remote-cache-url: ${{ vars.NX_REMOTE_CACHE_URL }}
          remote-cache-token: ${{ secrets.NX_REMOTE_CACHE_READ_TOKEN }}
      - name: Scan source and prove the scanner contract
        run: pnpm exec nx run-many -t scan-secrets test:secret-scanning --projects=axm --nxBail

  required:
    name: Required CI
    if: always()
    needs:
      - classify
      - secrets
      - commit-history
      - workflow-validation
      - specification-verdict
      - extension-lint
      - documentation
      - verify-pr
      - verify-main
      - verify-e2e
      - windows-workspace
      - binary-smoke
      - release-content
      - npm-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          RESULTS: >-
            ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.classify.outputs.required-jobs }}
        run: |
          if [[ -z "$REQUIRED_JOBS" ]]; then
            echo "::error title=Required CI failed::classification did not publish the required job list"
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' \
            <<<"$REQUIRED_JOBS" >/dev/null; then
            echo "::error title=Required CI failed::classification published an invalid required job list"
            exit 1
          fi
          expected_failures=""
          while IFS= read -r job; do
            result=$(jq -r --arg job "$job" '.[$job].result // "missing"' <<<"$RESULTS")
            if [[ "$result" != "success" ]]; then
              expected_failures+="- \`$job\`: $result"$'\n'
            fi
          done < <(jq -r '.[]' <<<"$REQUIRED_JOBS")
          failures=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "- `\(.key)`: \(.value.result)"
          ' <<<"$RESULTS")
          failures="${expected_failures}${failures}"
          if [[ -n "$failures" ]]; then
            {
              echo "## Required CI failures"
              echo
              printf '%s\n' "$failures"
            } >> "$GITHUB_STEP_SUMMARY"
            failure_count=$(wc -l <<<"$failures" | tr -d ' ')
            echo "::error title=Required CI failed::${failure_count} applicable job(s) did not succeed"
            exit 1
          fi
          {
            echo "## Required CI"
            echo
            echo "All applicable jobs succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
