# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: kode
name: Kode
vendor: shareAI-lab
homepage: https://github.com/shareAI-lab/Kode-Agent
interfaces:
  - cli
docs:
  - label: Kode Agent repository
    url: https://github.com/shareAI-lab/Kode-Agent
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .kode/skills
  sources:
    - https://github.com/shareAI-lab/Kode-Agent
  lastVerified: 2026-05-20
subagents:
  notes: No industry spec for subagents yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://github.com/shareAI-lab/Kode-Agent
  lastVerified: 2026-05-20
  directory: .kode/agents
  layout: directory
instructions:
  standardsCompliance: full
  convention: universal
  scopes:
    - project
  files:
    - AGENTS.md
  nestedDiscovery: true
  sources:
    - https://github.com/shareAI-lab/Kode-Agent
  lastVerified: 2026-05-20
  kind: agents-md
permissions:
  scopes:
    - user
    - project
  mechanism:
    - cli-flag
  cliFlags:
    - flag: --safe
      note: Enables permission checks instead of Kode's default YOLO mode.
    - flag: --dangerously-skip-permissions
      note: Explicitly bypasses permission checks.
  sources:
    - https://github.com/shareAI-lab/Kode-Agent
  lastVerified: 2026-05-20
rootDir: .kode
