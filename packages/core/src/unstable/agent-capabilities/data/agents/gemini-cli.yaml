# yaml-language-server: $schema=../../agent.schema.json
id: gemini-cli
name: Gemini CLI
vendor: Google
homepage: https://github.com/google-gemini/gemini-cli
interfaces:
  - cli
family: google
docs:
  - label: Gemini CLI documentation
    url: https://github.com/google-gemini/gemini-cli/tree/main/docs
  - label: Transitioning Gemini CLI to Antigravity CLI
    url: https://developers.googleblog.com/an-important-update-transitioning-gemini-cli-to-antigravity-cli/
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .gemini/skills
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/cli-reference.md
  lastVerified: 2026-05-16
commands:
  scopes:
    - user
    - project
  directory: .gemini/commands
  notes: >
    Custom slash commands are TOML files under .gemini/commands (project) or ~/.gemini/commands
    (user); AXM bridges its command extension format to TOML.
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/custom-commands.md
  lastVerified: 2026-05-18
mcp:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  transports:
    - stdio
  config:
    serversKey: mcpServers
    nativeEnabled: false
    targets:
      - scope: project
        path: .gemini/settings.json
        format: json
      - scope: user
        path: ~/.gemini/settings.json
        format: json
    stdio:
      command: split
      envKey: env
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/cli-reference.md
  lastVerified: 2026-05-16
subagents:
  scopes:
    - user
    - project
  notes: >
    Subagents are Markdown files with YAML frontmatter under .gemini/agents (project) or
    ~/.gemini/agents (user); shipped in Gemini CLI v0.38.1.
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/core/subagents.md
  lastVerified: 2026-05-18
  directory: .gemini/agents
  layout: directory
instructions:
  standardsCompliance: parity
  convention: vendor
  scopes:
    - user
    - project
  files:
    - GEMINI.md
  nestedDiscovery: true
  notes: >
    Consumer access (free, AI Pro, AI Ultra) ends 2026-06-18; Antigravity CLI succeeds Gemini CLI
    for those tiers. Enterprise customers on paid API keys retain access.
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/configuration.md
    - https://developers.googleblog.com/an-important-update-transitioning-gemini-cli-to-antigravity-cli/
  lastVerified: 2026-05-20
  kind: own-file
permissions:
  scopes:
    - user
    - project
  mechanism:
    - config-file
    - cli-flag
  configFiles:
    - scope: user
      path: ~/.gemini/settings.json
      format: json
      gitignored: false
    - scope: project
      path: .gemini/settings.json
      format: json
      gitignored: false
  grammar:
    style: prefix
    example: run_shell_command(axm)
    notes: >
      tools.core is prefix-matched and currently documented in docs/tools/shell.md. The newer Policy
      Engine is replacing --allowed-tools; tools.core is still functional but transitional.
  prerequisites:
    - key: security.folderTrust.enabled
      value: "true"
      scope: user
      note: Untrusted folders disable all auto-acceptance regardless of other settings.
  cliFlags:
    - flag: --approval-mode=yolo
      note: Broad bypass; not tool-scoped. Blocked when security.disableYoloMode=true.
    - flag: --yolo
      note: Alias for --approval-mode=yolo.
  grants:
    shell:
      target: ~/.gemini/settings.json
      patch:
        security:
          folderTrust:
            enabled: true
          enablePermanentToolApproval: true
        tools:
          core:
            - run_shell_command(${tool})
  sources:
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/settings.md
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/cli-reference.md
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/tools/shell.md
    - https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/trusted-folders.md
  lastVerified: 2026-05-18
rootDir: .gemini
