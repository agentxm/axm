# yaml-language-server: $schema=../../agent.schema.json
id: mistral-vibe
name: Mistral Vibe
vendor: Mistral AI
homepage: https://docs.mistral.ai/mistral-vibe/overview
interfaces: [cli]
family: mistral
docs:
  - label: Mistral Vibe documentation
    url: https://docs.mistral.ai/mistral-vibe/overview

skills:
  support: standard
  scopes: [user, project]
  directory: .vibe/skills
  sources:
    - https://docs.mistral.ai/mistral-vibe/agents-skills
  lastVerified: 2026-05-20

mcp:
  support: standard
  scopes: [user, project]
  transports: [stdio, http]
  config:
    serversKey: mcp_servers
    nativeEnabled: true
    targets:
      - { scope: project, path: .vibe/config.toml, format: toml }
      - { scope: user, path: "~/.vibe/config.toml", format: toml }
    stdio:
      typeField: { name: transport, value: stdio }
      command: split
    remote:
      typeField: { name: transport, value: { streamable-http: streamable-http, sse: http } }
      urlKey: { streamable-http: url, sse: url }
      headersKey: headers
  sources:
    - https://docs.mistral.ai/mistral-vibe/terminal/configuration
  lastVerified: 2026-05-20

subagents:
  support: bridged
  scopes: [user]
  sources:
    - https://docs.mistral.ai/mistral-vibe/agents-skills
  lastVerified: 2026-05-20

instructions:
  support: standard
  scopes: [project]
  files: [AGENTS.md]
  nestedDiscovery: false
  sources:
    - https://docs.mistral.ai/mistral-vibe/agents-skills
  lastVerified: 2026-05-20
