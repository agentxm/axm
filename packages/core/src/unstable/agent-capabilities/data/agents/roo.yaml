# yaml-language-server: $schema=../../agent.schema.json
id: roo
name: Roo Code
vendor: Roo Code
homepage: https://roocode.com
interfaces:
  - ide-extension
docs:
  - label: Roo Code documentation
    url: https://docs.roocode.com
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .roo/skills
  sources:
    - https://docs.roocode.com/features/skills
  lastVerified: 2026-05-20
mcp:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  transports:
    - stdio
    - http
  config:
    serversKey: mcpServers
    nativeEnabled: true
    targets:
      - scope: project
        path: .roo/mcp.json
        format: json
      - scope: user
        path: ~/.roo/mcp.json
        format: json
    stdio:
      command: split
      envKey: env
    remote:
      typeField:
        name: type
        value:
          streamable-http: http
          sse: http
      urlKey:
        streamable-http: url
        sse: url
      headersKey: headers
  sources:
    - https://docs.roocode.com/features/mcp/using-mcp-in-roo
  lastVerified: 2026-05-20
subagents:
  notes: No industry spec for subagents yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://docs.roocode.com/features/custom-modes
  lastVerified: 2026-05-20
  directory: .roomodes
  layout: file
rules:
  notes: No industry spec for rule files yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  directory: .roo/rules
  sources:
    - https://docs.roocode.com/features/rules
  lastVerified: 2026-05-20
rootDir: .roo
commands:
  notes: No industry spec for slash commands yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://docs.roocode.com
  lastVerified: 2026-05-20
  directory: .roo/commands
