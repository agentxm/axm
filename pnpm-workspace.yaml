packages:
  - apps/*
  - packages/*/*
  - tools/*

# Standalone producers cross-compile these five release targets. Their optional
# native addons must be installed even when the producer runs on another host.
supportedArchitectures:
  - darwin-arm64
  - darwin-x64
  - linux-arm64
  - linux-x64
  - win32-x64

verifyDepsBeforeRun: error
# mise owns the pnpm version; keep the lockfile as one document for dependency graph readers.
pmOnFail: ignore

catalog:
  "@effect/eslint-plugin": ^0.3.2
  "@effect/language-service": ^0.87.5
  "@effect/openapi-generator": 4.1.3
  "@effect/platform-node": 4.1.3
  "@effect/platform-node-shared": 4.1.3
  "@effect/tsgo": ^0.53.3
  "@effect/vitest": 4.1.3
  "@eslint/js": ^10.0.0
  "@nx/devkit": 24.0.6
  "@nx/eslint": 24.0.6
  "@nx/eslint-plugin": 24.0.6
  "@nx/js": 24.0.6
  "@nx/vitest": 24.0.6
  "@swc-node/register": ^1.12.1
  "@swc/core": ^1.16.18
  "@types/bun": ^1.4.4
  "@types/node": 24.19.2
  "@types/semver": ^7.8.0
  "@typescript-eslint/parser": ^8.71.2
  "@typescript/native": npm:typescript@^7.0.2
  allure: ^3.33.0
  allure-js-commons: ^3.14.0
  allure-vitest: ^3.14.0
  effect: 4.1.3
  eslint: ^10.13.0
  execa: ^10.1.1
  "@fast-check/vitest": ^0.5.0
  fflate: ^0.8.3
  tar-stream: ^3.2.2
  husky: ^9.1.7
  jsonc-eslint-parser: ^3.1.0
  jsonc-parser: ^3.3.1
  smol-toml: ^1.9.1
  lint-staged: ^17.5.1
  nx: 24.0.6
  packageurl-js: ^2.0.1
  prettier: ^3.9.10
  semver: ^7.8.5
  simple-git: ^4.0.1
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-eslint: ^8.71.2
  vite: ^8.3.7
  vitest: ^5.1.0
  yaml: ^2.9.1
  eslint-plugin-boundaries: 7.2.0
  dependency-cruiser: 18.6.0
  eslint-import-resolver-typescript: 4.4.5
  "@boundaries/elements": 3.1.1

allowBuilds:
  # Platform bindings are supplied by optional packages; no fallback download.
  unrs-resolver: false
  "@swc/core": true
  esbuild: true
  nx: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@agentxm/*"
  - axm.sh

overrides:
  # Compatible type consumers share the declared Node/Bun tooling cohort.
  "@types/node@": "catalog:"
  "@babel/plugin-transform-modules-systemjs@<7.29.4": 7.29.4
  adm-zip@<0.6.1: 0.6.1
  axios@<1.18.0: 1.18.0
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  flatted@<3.4.2: 3.4.2
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  handlebars@>=3.0.0 <4.7.10: 4.7.10
  undici@>=7.0.0 <7.30.1: 7.30.1
  picomatch@>=4.0.0 <4.0.5: 4.0.5
  postcss@>=8.0.0 <8.5.23: 8.5.23
  nanoid@<3.3.18: 3.3.18
  qs@>=6.11.1 <6.16.0: 6.16.0
  smol-toml@<=1.7.0: 1.7.1
  undici@>=8.0.0 <8.12.2: 8.12.2
  markdown-it@>=15.0.0 <15.0.3: 15.0.3
  follow-redirects@<1.16.1: 1.16.1
  dompurify@>=3.0.0 <3.4.17: 3.4.17
  zod@>=4.0.0 <4.6.6: 4.6.6
