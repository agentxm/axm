# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: zencoder
name: Zencoder
vendor: Zencoder
homepage: https://zencoder.ai
interfaces:
  - ide-extension
docs:
  - label: Zencoder documentation
    url: https://docs.zencoder.ai
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .zencoder/skills
  sources:
    - https://docs.zencoder.ai/features/agent-skills
  lastVerified: 2026-05-20
mcp:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  transports:
    - stdio
  config:
    serversKey: mcpServers
    nativeEnabled: true
    targets:
      - scope: user
        path: ~/.zencoder/mcp.json
        format: json
      - scope: project
        path: .zencoder/mcp.json
        format: json
    stdio:
      command: split
      envKey: env
  sources:
    - https://docs.zencoder.ai/features/integrations-and-mcp
  lastVerified: 2026-05-20
subagents:
  notes: No industry spec for subagents yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://docs.zencoder.ai/features/agents-overview
  lastVerified: 2026-05-20
  directory: .zencoder/agents
  layout: directory
rules:
  notes: No industry spec for rule files yet; AXM bridges to the agent's native layout.
  scopes:
    - project
  directory: .zencoder/rules
  sources:
    - https://docs.zencoder.ai/features/agents-overview
    - https://docs.zencoder.ai/learn/10x-engineer/module-03
  lastVerified: 2026-05-20
rootDir: .zencoder
