name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: "static"
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@v5

      - uses: oven-sh/setup-bun@v2.0.2

      - run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5.0.1

      - name: Release plan check
        if: github.event_name == 'pull_request'
        run: pnpm release:plan:check

      - name: CI (affected)
        if: github.event_name == 'pull_request'
        run: pnpm run ci:affected

      - name: CI
        if: github.ref == 'refs/heads/main'
        run: pnpm run ci

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report test results
        uses: mikepenz/action-junit-report@v6.4.0
        if: always()
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results
          include_passed: true

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.0
        with:
          name: axm-binaries-${{ github.sha }}
          path: packages/cli/dist/bin/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
