# yaml-language-server: $schema=../../agent.schema.json
id: windsurf
name: Windsurf
vendor: Cognition
homepage: https://windsurf.com
interfaces: [ide-extension]
family: cognition
docs:
  - label: Windsurf documentation
    url: https://docs.windsurf.com

skills:
  support: standard
  scopes: [user, project]
  directory: .windsurf/skills
  notes: >
    Cascade reads SKILL.md skills from .windsurf/skills (project) and
    ~/.codeium/windsurf/skills (user) with progressive disclosure.
  sources:
    - https://docs.windsurf.com/windsurf/cascade/skills
  lastVerified: 2026-05-18

commands:
  support: bridged
  scopes: [user, project]
  directory: .windsurf/workflows
  notes: >
    Windsurf Workflows are slash-command-invoked Markdown prompts under
    .windsurf/workflows (project) and ~/.codeium/windsurf/global_workflows
    (user).
  sources:
    - https://docs.windsurf.com/windsurf/cascade/workflows
  lastVerified: 2026-05-18

mcp:
  support: standard
  scopes: [user, project]
  transports: [stdio]
  sources:
    - https://docs.windsurf.com/windsurf/cascade/mcp
  lastVerified: 2026-05-16

subagents:
  support: unsupported
  scopes: []
  notes: >
    Cascade exposes only built-in and internal subagents plus multi-agent
    sessions; no user-authorable custom subagent extension type is documented.
  sources:
    - https://docs.windsurf.com/windsurf/cascade/agents-md
  lastVerified: 2026-05-18

instructions:
  support: standard
  scopes: [project]
  files: [AGENTS.md]
  nestedDiscovery: true
  sources:
    - https://docs.windsurf.com/windsurf/cascade/agents-md
  lastVerified: 2026-05-16

rules:
  support: bridged
  scopes: [user, project]
  directory: .windsurf/rules
  sources:
    - https://docs.windsurf.com/windsurf/cascade/rules
  lastVerified: 2026-05-16

permissions:
  support: standard
  scopes: [user]
  mechanism: [config-file, ui-only]
  configFiles:
    - scope: user
      path: VS Code settings (Settings UI)
      format: vscode-settings
      gitignored: false
  grammar:
    style: prefix
    example: axm
    notes: >
      windsurf.cascadeCommandsAllowList is prefix-matched. Workspace-scoped
      override for these keys is not documented; configure at user scope.
      Teams/Enterprise can merge in lists via the Admin Portal.
  prerequisites:
    - key: Cascade auto-execution level
      value: "allowlist_only | turbo"
      scope: user
      note: Disabled and Auto modes ignore allowlist entries; set via the Windsurf Settings panel.
  grants:
    shell:
      target: VS Code settings
      patch:
        windsurf.cascadeCommandsAllowList:
          - "${tool}"
  sources:
    - https://docs.windsurf.com/windsurf/terminal
    - https://docs.windsurf.com/windsurf/cascade
  lastVerified: 2026-05-18
