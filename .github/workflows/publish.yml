name: Publish to npm

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm nx run-many -t build typecheck test e2e lint

      - name: Publish
        run: pnpm nx run cli:publish
