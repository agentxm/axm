# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: pi
name: Pi
vendor: Mario Zechner
homepage: https://github.com/badlogic/pi-mono
interfaces:
  - cli
docs:
  - label: Pi coding agent documentation
    url: https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/README.md
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .pi/skills
  notes: >
    Skills follow the Agent Skills SKILL.md standard and are invoked via /skill:name. Pi discovers
    them from .pi/skills and .agents/skills (project, searched up through parent directories) and
    ~/.pi/agent/skills and ~/.agents/skills (user).
  sources:
    - https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/README.md
  lastVerified: 2026-05-18
commands:
  scopes:
    - user
    - project
  directory: .pi/prompts
  notes: >
    Custom slash commands are Markdown prompt templates with {{variable}} interpolation, expanded
    via /templatename. Stored in .pi/prompts (project) or ~/.pi/agent/prompts (user). Prompt
    templates have no industry spec yet.
  sources:
    - https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/README.md
  lastVerified: 2026-05-18
mcp:
  lifecycle: unsupported
  standardsCompliance: none
  convention: vendor
  scopes: []
  transports: []
  notes: >
    Pi ships a deliberate "no MCP" core with only four built-in tools (read, write, edit, bash). MCP
    can only be added by installing or building a TypeScript extension; there is no native MCP
    server configuration.
  sources:
    - https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/README.md
  lastVerified: 2026-05-18
subagents:
  lifecycle: unsupported
  scopes: []
  notes: >
    Pi has no built-in subagent system by design. Multi-agent workflows are expected to be composed
    externally (e.g. spawning pi instances under tmux) or via a TypeScript extension.
  sources:
    - https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/README.md
  lastVerified: 2026-05-18
instructions:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  files:
    - AGENTS.md
  nestedDiscovery: true
  notes: >
    AGENTS.md and CLAUDE.md context load at startup from the global directory (~/.pi/agent),
    parent directories, and the current directory; all matching files are concatenated.
  sources:
    - https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/README.md
  lastVerified: 2026-05-18
  kind: agents-md
permissions:
  lifecycle: unsupported
  scopes: []
  mechanism: []
  notes: >
    Pi has no per-call approval prompts and no permission config file. Tools run without
    confirmation; the philosophy is to run pi in a container or supply a confirmation flow via
    extension. Tool availability is selected at invocation with --tools and --no-builtin-tools, but
    this is tool enablement rather than a permission-grant surface.
  sources:
    - https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/README.md
  lastVerified: 2026-05-18
rootDir: .pi
