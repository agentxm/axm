# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: trae
name: Trae
vendor: ByteDance
homepage: https://www.trae.ai
interfaces:
  - ide-extension
family: bytedance
docs:
  - label: Trae documentation
    url: https://docs.trae.ai
skills:
  standardsCompliance: partial
  convention: vendor
  scopes:
    - project
  directory: .trae/skills
  sources:
    - https://github.com/HighMark-31/TRAE-Tips/blob/main/Agents-Rules-Skills.md
  lastVerified: 2026-05-20
mcp:
  standardsCompliance: full
  convention: universal
  scopes:
    - project
  transports:
    - stdio
    - http
    - sse
  config:
    serversKey: mcpServers
    nativeEnabled: true
    targets:
      - scope: project
        path: .trae/mcp.json
        format: json
    stdio:
      command: split
      envKey: env
    remote:
      typeField:
        name: type
        value:
          streamable-http: http
          sse: sse
      urlKey:
        streamable-http: url
        sse: url
      headersKey: headers
  sources:
    - https://traeide.com/news/6
  lastVerified: 2026-05-20
rules:
  notes: No industry spec for rule files yet; AXM bridges to the agent's native layout.
  scopes:
    - project
  directory: .trae/rules
  sources:
    - https://github.com/HighMark-31/TRAE-Tips/blob/main/Agents-Rules-Skills.md
  lastVerified: 2026-05-20
rootDir: null
