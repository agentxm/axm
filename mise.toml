[tools]
node = "24.22.0"
pnpm = "12.18.0"
bun = "1.4.4"
gitleaks = "8.30.1"
"aqua:rhysd/actionlint" = "1.7.12"
"github:datalust/seqcli" = "2026.1.02662"

[tools."github:Shopify/toxiproxy"]
version = "2.13.0"
[tools."github:Shopify/toxiproxy".platforms]
linux-x64 = { asset_pattern = "toxiproxy_*_linux_amd64.tar.gz" }
linux-arm64 = { asset_pattern = "toxiproxy_*_linux_arm64.tar.gz" }
macos-x64 = { asset_pattern = "toxiproxy_*_darwin_amd64.tar.gz" }
macos-arm64 = { asset_pattern = "toxiproxy_*_darwin_arm64.tar.gz" }
windows-x64 = { asset_pattern = "toxiproxy_*_windows_amd64.tar.gz" }
