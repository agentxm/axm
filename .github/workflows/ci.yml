name: CI

run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI - PR #{0}', github.event.pull_request.number) ||
    format('CI - {0}', github.ref_name)
  }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner substrate for full verification
        required: true
        default: trusted-ci
        type: choice
        options:
          - trusted-ci
          - github-hosted

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
    github.event_name == 'workflow_dispatch' && inputs.runner || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NX_TUI: "false"
  NX_DEFAULT_OUTPUT_STYLE: static
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: "false"
  NX_PARALLEL: "2"
  VITEST_MAX_WORKERS: "2"

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
      documentation: ${{ steps.classify.outputs.documentation }}
      image: ${{ steps.classify.outputs.image }}
      workflow: ${{ steps.classify.outputs.workflow }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          install: "false"

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          pnpm --config.verify-deps-before-run=warn run classify:ci --
          --base "$BASE_SHA" --head "$HEAD_SHA"

  format:
    name: Format
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Verify formatting
        run: pnpm run format:check

  specification-verdict:
    name: Specification verdict
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Create local main ref for the requirement diff
        run: git fetch --no-tags origin main:main

      - name: Render the per-change specification verdict
        run: pnpm exec nx run axm:specification-verdict -- --base "$(git merge-base main HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

  extension-lint:
    name: AXM extension lint
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Lint bundled AXM skill
        run: pnpm exec nx run axm:lint-bundled-skill --outputStyle=static

  documentation:
    name: Documentation integrity
    needs: classify
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify changed documentation patch integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" -- '*.md' '*.mdx'

  workflow-validation:
    name: Workflow validation
    needs: classify
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint from the pinned CI image
        # Host-adapter boundary in docs/guides/repository-task-interface.md:
        # this job
        # installs no host toolchain, so no pnpm exists to resolve container:ci.
        run: scripts/container-environment.sh ci actionlint

  image:
    name: CI image
    needs: classify
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.image == 'true'
    permissions:
      attestations: read
      contents: read
    uses: ./.github/workflows/ci-image.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      runner: github-hosted

  verify-pr:
    name: Verify affected workspace
    needs: classify
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create local main ref for affected diff
        run: git fetch --no-tags origin main:main

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          key: axm-ci-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            axm-ci-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Nx cache
        id: nx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/axm-ci-cache/nx
          key: >-
            axm-ci-nx-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('containers/ci/CI_IMAGE') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
            github.event.pull_request.head.sha }}
          restore-keys: |
            axm-ci-nx-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('containers/ci/CI_IMAGE') }}-${{ hashFiles('pnpm-lock.yaml') }}-
            axm-ci-nx-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('containers/ci/CI_IMAGE') }}-
            axm-ci-nx-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Determine release verification mode
        id: release-mode
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          release_preparation=false
          release_subject="release: ${HEAD_REF#release/}"
          if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] &&
            [[ "$HEAD_REF" =~ ^release/cli-v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] &&
            git log --format=%s "main..$HEAD_SHA" | grep --fixed-strings --line-regexp --quiet -- "$release_subject"; then
            release_preparation=true
          fi
          echo "release_preparation=$release_preparation" >> "$GITHUB_OUTPUT"

      - name: Verify affected changes in pinned CI image
        id: verify
        env:
          AXM_CI_PNPM_CACHE_VOLUME: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          AXM_CI_NX_CACHE_VOLUME: ${{ runner.temp }}/axm-ci-cache/nx
          AXM_CONTAINER_NX_PARALLEL: "3"
          AXM_CONTAINER_VITEST_MAX_WORKERS: "2"
          AXM_RELEASE_PREPARATION: ${{ steps.release-mode.outputs.release_preparation }}
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
        # Host-adapter boundary in docs/guides/repository-task-interface.md:
        # this job
        # installs no host toolchain, so no pnpm exists to resolve container:ci.
        run: |
          scripts/container-environment.sh ci bash -lc '
            set -euo pipefail
            pnpm install --frozen-lockfile
            if [[ "$AXM_RELEASE_PREPARATION" != "true" ]]; then
              pnpm release:plan:check
            fi
            pnpm run verify:clean
            pnpm run verify:affected:report
          '

      - name: Publish verification summary
        if: always()
        env:
          NX_CACHE_HIT: ${{ steps.nx-cache.outputs.cache-hit }}
          NX_CACHE_PATH: ${{ runner.temp }}/axm-ci-cache/nx
          PNPM_CACHE_HIT: ${{ steps.pnpm-cache.outputs.cache-hit }}
          PNPM_CACHE_PATH: ${{ runner.temp }}/axm-ci-cache/pnpm-store
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          cache_status() {
            case "$1" in
              true) printf 'Exact hit' ;;
              false) printf 'Fallback hit' ;;
              *) printf 'Miss' ;;
            esac
          }
          cache_size() {
            if [[ -d "$1" ]]; then
              du -sh "$1" | cut -f1
            else
              printf '0 B'
            fi
          }
          verify_outcome=${VERIFY_OUTCOME:-not run}
          {
            echo "## Hosted PR verification"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Outcome | $verify_outcome |"
            echo "| pnpm cache | $(cache_status "$PNPM_CACHE_HIT") ($(cache_size "$PNPM_CACHE_PATH")) |"
            echo "| Nx cache | $(cache_status "$NX_CACHE_HIT") ($(cache_size "$NX_CACHE_PATH")) |"
            echo "| Concurrency | Nx 3; Vitest 2 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-pr
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-pr
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results
          include_passed: true

  verify-main-trusted:
    name: Verify workspace (trusted-ci)
    needs: classify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.runner == 'trusted-ci')
    runs-on:
      group: trusted-ci
      labels: self-hosted
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clear prior workspace evidence
        run: rm -rf "$GITHUB_WORKSPACE/test-results"

      - name: Verify workspace in pinned CI image
        id: verify
        env:
          AXM_CONTAINER_NX_PARALLEL: "2"
          AXM_CONTAINER_VITEST_MAX_WORKERS: "2"
        # Host-adapter boundary in docs/guides/repository-task-interface.md:
        # this job
        # installs no host toolchain, so no pnpm exists to resolve container:ci.
        run: >-
          scripts/container-environment.sh ci bash -lc
          'pnpm install --frozen-lockfile && pnpm run ci:workspace:report'

      - name: Publish workspace verification summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## Trusted workspace verification"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Outcome | ${VERIFY_OUTCOME:-not run} |"
            echo "| Scope | Clean checkout, formatting, lint, typecheck, build, and unit tests |"
            echo "| Concurrency | Nx 2; Vitest 2 |"
            echo "| Cache | Persistent image-and-lockfile-scoped pnpm and Nx volumes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit artifacts
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-main-trusted-workspace
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-main-trusted-workspace
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always() && steps.verify.outcome != 'skipped'
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Workspace Test Results
          include_passed: true

  verify-e2e-main-trusted:
    name: Verify CLI E2E - ${{ matrix.name }}
    needs: classify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.runner == 'trusted-ci')
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: main-1
            name: main shard 1/2
            command: bun scripts/profile-nx.ts e2e-main-1 run cli-e2e:e2e-main --outputStyle=static -- --shard=1/2
          - id: main-2
            name: main shard 2/2
            command: bun scripts/profile-nx.ts e2e-main-2 run cli-e2e:e2e-main --outputStyle=static -- --shard=2/2
          - id: distribution
            name: binary and install distribution
            command: bun scripts/profile-nx.ts e2e-distribution run-many --projects cli-e2e -t binary-smoke install-suite --nxBail --outputStyle=static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clear prior workspace evidence
        run: rm -rf "$GITHUB_WORKSPACE/test-results"

      - name: Verify fresh CLI E2E partition in pinned CI image
        id: verify
        env:
          AXM_CONTAINER_NX_PARALLEL: "3"
          AXM_CONTAINER_VITEST_MAX_WORKERS: "4"
          AXM_E2E_COMMAND: ${{ matrix.command }}
        # Host-adapter boundary in docs/guides/repository-task-interface.md:
        # this job
        # installs no host toolchain, so no pnpm exists to resolve container:ci.
        run: >-
          scripts/container-environment.sh ci bash -lc
          'pnpm install --frozen-lockfile && scripts/with-allure-report.sh bash -lc "$AXM_E2E_COMMAND"'

      - name: Publish E2E verification summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## CLI E2E verification — ${{ matrix.name }}"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Outcome | ${VERIFY_OUTCOME:-not run} |"
            echo "| Freshness | Leaf E2E targets are non-cacheable; build prerequisites may be reused |"
            echo "| Concurrency | Three hosted partitions; Vitest 4 within each main shard |"
            echo "| Cache | Nx retains only reusable prerequisite work |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit artifacts
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-main-e2e-${{ matrix.id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-main-e2e-${{ matrix.id }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always() && steps.verify.outcome != 'skipped'
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: CLI E2E Test Results (${{ matrix.name }})
          include_passed: true

  verify-main-hosted:
    name: Verify full workspace (GitHub-hosted fallback)
    needs: classify
    if: github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure hosted runner capacity
        id: capacity
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "disk_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')" >> "$GITHUB_OUTPUT"
          echo "memory_mb=$(free -m | awk '/^Mem:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Verify main in pinned CI image
        id: verify
        # Host-adapter boundary in docs/guides/repository-task-interface.md:
        # this job
        # installs no host toolchain, so no pnpm exists to resolve container:ci.
        run: >-
          scripts/container-environment.sh ci bash -lc
          'pnpm install --frozen-lockfile && pnpm run ci:report'

      - name: Report hosted runner measurement
        if: always()
        env:
          STARTED: ${{ steps.capacity.outputs.started }}
          DISK_KB: ${{ steps.capacity.outputs.disk_kb }}
          MEMORY_MB: ${{ steps.capacity.outputs.memory_mb }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          started=${STARTED:-$(date +%s)}
          disk_kb=${DISK_KB:-0}
          memory_mb=${MEMORY_MB:-0}
          elapsed=$(( $(date +%s) - started ))
          {
            echo "## GitHub-hosted pinned-image trial"
            echo
            echo "| Signal | Result |"
            echo "| --- | --- |"
            echo "| Outcome | ${VERIFY_OUTCOME:-not run} |"
            echo "| Serial elapsed time | ${elapsed}s |"
            echo "| Initial available disk | $((disk_kb / 1024)) MiB |"
            echo "| Runner memory | ${memory_mb} MiB |"
            echo "| Workload concurrency | Nx 2; Vitest 2 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit artifacts
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-main-hosted
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-main-hosted
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish JUnit report
        if: always() && steps.verify.outcome != 'skipped'
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "test-results/**/junit.xml"
          check_name: Test Results
          include_passed: true

  windows-workspace:
    name: Windows workspace lifecycle
    needs: classify
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Verify Windows instruction fallback
        run: pnpm nx run workspace-projection:test-windows --outputStyle=static

      - name: Verify Windows workspace mutations
        env:
          # This lifecycle target builds the portable JS CLI; dedicated main E2E
          # partitions own compiled-host coverage.
          AXM_E2E_CLI_SOURCE: built
        run: pnpm nx run cli-e2e:e2e-windows --outputStyle=static

      - name: Verify published-package launcher isolation
        run: pnpm exec nx run axm:test --args="verify-installed-package.test.ts" --outputStyle=static

      - name: Generate Windows Allure report
        if: always()
        run: pnpm exec nx run axm:allure-report --outputStyle=static

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows-workspace-${{ github.sha }}
          path: |
            test-results/workspace-projection-windows/
            test-results/cli-e2e-windows/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-windows-workspace-${{ github.sha }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Windows JUnit report
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "test-results/*-windows/junit.xml"
          check_name: Windows Workspace Test Results
          include_passed: true

  binary-smoke:
    name: Binary Smoke - ${{ matrix.os }}
    needs: classify
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: axm-linux-x64
          - os: ubuntu-24.04-arm
            binary_name: axm-linux-arm64
          - os: macos-latest
            binary_name: axm-darwin-arm64
          - os: macos-15-intel
            binary_name: axm-darwin-x64
          - os: windows-latest
            binary_name: axm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Compile host binary
        run: pnpm exec nx run cli:compile-host --outputStyle=static

      - name: Mark binary executable
        if: runner.os != 'Windows'
        run: chmod +x apps/cli/dist/host-bin/${{ matrix.binary_name }}

      - name: Run binary smoke test
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/apps/cli/dist/host-bin/${{ matrix.binary_name }}
        run: pnpm exec nx run cli-e2e:binary-smoke-artifact --outputStyle=static

      - name: Generate Allure report
        if: always()
        run: pnpm exec nx run axm:allure-report --outputStyle=static

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-binary-${{ matrix.binary_name }}-${{ github.sha }}
          path: test-results/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compiled binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axm-binary-${{ matrix.binary_name }}-${{ github.sha }}
          path: apps/cli/dist/host-bin/${{ matrix.binary_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  npm-cohort:
    name: Produce verified npm cohort
    needs: classify
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Pack and verify the fixed npm cohort once
        run: >-
          pnpm exec nx run axm:produce-release-cohort --outputStyle=static --
          "$GITHUB_SHA" release-npm

      - name: Upload exact npm cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axm-npm-cohort-${{ github.sha }}
          path: release-npm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  required:
    name: Required CI
    if: always()
    needs:
      - classify
      - format
      - specification-verdict
      - extension-lint
      - documentation
      - workflow-validation
      - image
      - verify-pr
      - verify-main-trusted
      - verify-e2e-main-trusted
      - verify-main-hosted
      - windows-workspace
      - binary-smoke
      - npm-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          RESULTS: >-
            ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_RUNNER: ${{ inputs.runner || '' }}
          CODE_CHANGED: ${{ needs.classify.outputs.code }}
          DOCS_CHANGED: ${{ needs.classify.outputs.documentation }}
          IMAGE_CHANGED: ${{ needs.classify.outputs.image }}
          WORKFLOW_CHANGED: ${{ needs.classify.outputs.workflow }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            expected=(classify format specification-verdict extension-lint windows-workspace)
            [[ "$CODE_CHANGED" == "true" ]] && expected+=(verify-pr)
            [[ "$DOCS_CHANGED" == "true" ]] && expected+=(documentation)
            [[ "$IMAGE_CHANGED" == "true" ]] && expected+=(image)
            [[ "$WORKFLOW_CHANGED" == "true" ]] && expected+=(workflow-validation)
          elif [[ "$EVENT_NAME" == "push" ]]; then
            expected=(classify verify-main-trusted verify-e2e-main-trusted windows-workspace binary-smoke npm-cohort)
          elif [[ "$SELECTED_RUNNER" == "github-hosted" ]]; then
            expected=(classify verify-main-hosted windows-workspace binary-smoke npm-cohort)
          else
            expected=(classify verify-main-trusted verify-e2e-main-trusted windows-workspace binary-smoke npm-cohort)
          fi
          expected_failures=""
          for job in "${expected[@]}"; do
            result=$(jq -r --arg job "$job" '.[$job].result // "missing"' <<<"$RESULTS")
            if [[ "$result" != "success" ]]; then
              expected_failures+="- \`$job\`: $result"$'\n'
            fi
          done
          failures=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "- `\(.key)`: \(.value.result)"
          ' <<<"$RESULTS")
          failures="${expected_failures}${failures}"
          if [[ -n "$failures" ]]; then
            {
              echo "## Required CI failures"
              echo
              printf '%s\n' "$failures"
            } >> "$GITHUB_STEP_SUMMARY"
            failure_count=$(wc -l <<<"$failures" | tr -d ' ')
            echo "::error title=Required CI failed::${failure_count} applicable job(s) did not succeed"
            exit 1
          fi
          {
            echo "## Required CI"
            echo
            echo "All applicable jobs succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
