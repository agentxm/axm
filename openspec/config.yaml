schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  proposal:
    - focus on the functional behavior and interaction patterns of the API or feature, not the implementation details
    - backward compatability is a non-goal
  design:
    - backward compatability is a non-goal
  tasks:
    - "TDD: add or update tests prior to implementation step: red, green, refactor until a good design"
    - "Add a typecheck/lint/test verification steps immediatly proceeding any implementation task, fix any issues found"
    - "add a task after every test verification step to to kill any runaway vitest worker processes"
