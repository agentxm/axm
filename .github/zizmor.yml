# https://docs.zizmor.sh/configuration/
rules:
  dangerous-triggers:
    # publish.yml accepts workflow_run only as a signal. Its source job resolves
    # and validates the completed CI run, exact main SHA, canonical release
    # subject, and successful required-CI result before privileged work begins.
    ignore:
      - publish.yml
  dependabot-cooldown:
    # Dependency update cadence is governed by the repository's existing
    # Dependabot policy; this workflow-focused gate does not change it.
    ignore:
      - dependabot.yml
  self-repository:
    # actionlint does not yet accept zizmor's `$/...` self-repository syntax.
    # Local actions and reusable workflows remain pinned by the checked-out
    # candidate revision, so keep the portable `./...` form until it does.
    ignore:
      - ci.yml
      - prepare-release.yml
      - publish.yml
