# yaml-language-server: $schema=../../agent.schema.json
id: droid
name: Droid
vendor: Factory
homepage: https://www.factory.ai
interfaces:
  - cli
  - ide-extension
docs:
  - label: Factory documentation
    url: https://docs.factory.ai
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .factory/skills
  sources:
    - https://docs.factory.ai/cli/configuration/skills
  lastVerified: 2026-05-20
commands:
  scopes:
    - project
  directory: .factory/commands
  notes: >
    Factory documents legacy slash commands as still supported, while skills supersede them for new
    reusable workflows.
  sources:
    - https://docs.factory.ai/cli/configuration/skills
  lastVerified: 2026-05-20
instructions:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  files:
    - AGENTS.md
  nestedDiscovery: true
  sources:
    - https://docs.factory.ai/cli/configuration/agents-md
  lastVerified: 2026-05-20
  kind: agents-md
rootDir: .factory
