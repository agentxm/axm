name: Binary Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NX_TUI: "false"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@v5

      - uses: oven-sh/setup-bun@v2.0.2

      - run: pnpm install --frozen-lockfile

      - name: Build and compile
        run: pnpm exec nx run cli:compile

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.0
        with:
          name: axm-binaries-${{ github.sha }}
          path: packages/cli/dist/bin/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  smoke:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: axm-linux-x64
          - os: ubuntu-24.04-arm
            binary_name: axm-linux-arm64
          - os: macos-latest
            binary_name: axm-darwin-arm64
          - os: macos-15-intel
            binary_name: axm-darwin-x64
          - os: windows-latest
            binary_name: axm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@v5

      - uses: oven-sh/setup-bun@v2.0.2

      - run: pnpm install --frozen-lockfile

      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: axm-binaries-${{ github.sha }}
          path: binaries

      - name: Make binary executable
        if: runner.os != 'Windows'
        run: chmod +x binaries/${{ matrix.binary_name }}

      - name: Smoke test compiled binary
        env:
          AXM_BINARY_PATH: ${{ github.workspace }}/binaries/${{ matrix.binary_name }}
        run: pnpm exec nx run cli-e2e:binary-smoke-artifact --outputStyle=static
