# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: antigravity
name: Antigravity
vendor: Google
homepage: https://antigravity.google
interfaces:
  - cli
  - ide-extension
family: google
detection:
  projectDirs:
    - .agents
    - .agent
  userDirs:
    - ~/.gemini/antigravity
docs:
  - label: Antigravity documentation
    url: https://antigravity.google/docs
  - label: Antigravity CLI overview
    url: https://antigravity.google/docs/cli-overview
skills:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
    - project
  directory: .agents/skills
  notes: >
    Antigravity 2.0 defaults to .agents/skills (project) and ~/.gemini/antigravity/skills (user);
    .agent/skills remains supported for backward compatibility.
  sources:
    - https://antigravity.google/docs/skills
  lastVerified: 2026-05-20
commands:
  scopes:
    - user
    - project
  directory: .agents/workflows
  notes: >
    Custom slash commands ("workflows") are Markdown files under .agents/workflows (project) or
    ~/.gemini/antigravity/global_workflows (user). Commands have no industry spec yet.
  sources:
    - https://antigravity.google/docs/rules-workflows
  lastVerified: 2026-05-20
mcp:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
  transports:
    - stdio
  config:
    serversKey: mcpServers
    nativeEnabled: false
    targets:
      - scope: user
        path: ~/.gemini/antigravity/mcp_config.json
        format: json
    stdio:
      command: split
      envKey: env
  sources:
    - https://antigravity.google/docs/mcp
  lastVerified: 2026-05-20
instructions:
  standardsCompliance: full
  convention: universal
  scopes:
    - project
  files:
    - AGENTS.md
  nestedDiscovery: true
  sources:
    - https://antigravity.google/docs/project-context
    - https://antigravity.google/docs/rules-workflows
  lastVerified: 2026-05-20
  kind: agents-md
rules:
  scopes:
    - user
    - project
  directory: .agents/rules
  notes: >
    Antigravity 2.0 reads workspace rules from .agents/rules (project). Global rules live at
    ~/.gemini/GEMINI.md and may collide with Gemini CLI's global context file.
  sources:
    - https://antigravity.google/docs/rules-workflows
  lastVerified: 2026-05-20
rootDir: null
