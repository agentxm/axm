name: Set up workspace toolchain
description: >-
  Install the host toolchain (Node, pnpm, Bun, Gitleaks) from mise.toml — the repository
  tool-version authority — and install workspace dependencies. Single source of
  truth for host-side toolchain setup so the versions live in mise.toml once and
  are never copied into individual workflow jobs.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after toolchain setup.
    required: false
    default: "true"

  remote-cache-bypass:
    description: Repository NX_SKIP_REMOTE_CACHE setting forwarded by the caller.
    required: false
    default: ""
  remote-cache-url:
    description: Native Nx remote-cache server URL; empty disables remote caching.
    required: false
    default: ""
  remote-cache-token:
    description: Read-only cache credential; only the trusted main warmer supplies a writer.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install toolchain from mise.toml
      uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
      with:
        # Other refs can restore main's toolchain without publishing duplicate caches.
        cache_save: ${{ github.ref == 'refs/heads/main' }}

    - name: Install Linux native prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libsecret-1-dev

    - name: Install workspace dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Configure native Nx remote caching
      shell: bash
      env:
        REMOTE_CACHE_URL: ${{ inputs.remote-cache-url }}
        REMOTE_CACHE_TOKEN: ${{ inputs.remote-cache-token }}
        CACHE_BYPASS: ${{ inputs.remote-cache-bypass }}
        CACHE_ACTOR: ${{ github.actor }}
        CACHE_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
      run: |
        echo "NX_CACHE_FAILURES=false" >> "$GITHUB_ENV"
        if [[ -n "$CACHE_BYPASS" && "$CACHE_BYPASS" != "true" && "$CACHE_BYPASS" != "false" ]]; then
          echo "::error::NX_SKIP_REMOTE_CACHE repository variable must be true or false"
          exit 1
        fi
        if [[ "$CACHE_BYPASS" == "true" || "${NX_SKIP_REMOTE_CACHE:-false}" == "true" || "$CACHE_ACTOR" == 'dependabot[bot]' || "$CACHE_FORK" == true ]]; then
          echo "NX_SKIP_REMOTE_CACHE=true" >> "$GITHUB_ENV"
          exit 0
        fi
        if [[ -z "$REMOTE_CACHE_URL" && -z "$REMOTE_CACHE_TOKEN" ]]; then
          echo "NX_SKIP_REMOTE_CACHE=true" >> "$GITHUB_ENV"
          exit 0
        fi
        if [[ -z "$REMOTE_CACHE_URL" || -z "$REMOTE_CACHE_TOKEN" ]]; then
          echo "::error::Remote cache requires both URL and credential"
          exit 1
        fi
        if [[ ! "$REMOTE_CACHE_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?/?$ || "$REMOTE_CACHE_TOKEN" == *$'\n'* || "$REMOTE_CACHE_TOKEN" == *$'\r'* ]]; then
          echo "::error::Invalid remote cache configuration"
          exit 1
        fi
        echo "::add-mask::$REMOTE_CACHE_TOKEN"
        {
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=${REMOTE_CACHE_URL%/}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=$REMOTE_CACHE_TOKEN"
          echo "NX_SKIP_REMOTE_CACHE=false"
        } >> "$GITHUB_ENV"
