packages:
  - apps/*
  - packages/*/*
  - tools/*

verifyDepsBeforeRun: error
# mise owns the pnpm version; keep the lockfile as one document for dependency graph readers.
pmOnFail: ignore

peerDependencyRules:
  allowedVersions:
    "@nx/vitest>vitest": "5"

catalog:
  "@effect/eslint-plugin": ^0.3.2
  "@effect/language-service": ^0.87.3
  "@effect/openapi-generator": 4.0.1
  "@effect/platform-node": 4.0.1
  "@effect/platform-node-shared": 4.0.1
  "@effect/tsgo": ^0.48.1
  "@effect/vitest": 4.0.1
  "@eslint/js": ^10.0.0
  "@nx/devkit": 23.2.1
  "@nx/eslint": 23.2.1
  "@nx/eslint-plugin": 23.2.1
  "@nx/js": 23.2.1
  "@nx/vitest": 23.2.1
  "@swc-node/register": ^1.12.1
  "@swc/core": ^1.16.2
  "@types/bun": ^1.4.2
  "@types/node": 24.19.0
  "@types/semver": ^7.8.0
  "@typescript-eslint/parser": ^8.71.1
  "@typescript/native": npm:typescript@^7.0.2
  allure: ^3.17.0
  allure-js-commons: ^3.12.2
  allure-vitest: ^3.12.2
  effect: 4.0.1
  eslint: ^10.12.0
  execa: ^10.0.1
  "@fast-check/vitest": ^0.5.0
  fflate: ^0.8.3
  tar-stream: ^3.2.1
  husky: ^9.1.7
  jsonc-eslint-parser: ^3.1.0
  jsonc-parser: ^3.3.1
  smol-toml: ^1.9.0
  lint-staged: ^17.5.1
  nx: 23.2.1
  packageurl-js: ^2.0.1
  prettier: ^3.9.8
  semver: ^7.8.5
  simple-git: ^4.0.1
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-eslint: ^8.71.1
  vite: ^8.3.2
  vitest: ^5.0.3
  yaml: ^2.9.1
  eslint-plugin-boundaries: 7.2.0
  dependency-cruiser: 18.4.0
  eslint-import-resolver-typescript: 4.4.5
  "@boundaries/elements": 3.1.1

allowBuilds:
  # Platform bindings are supplied by optional packages; no fallback download.
  unrs-resolver: false
  "@swc/core": true
  esbuild: true
  msgpackr-extract: false
  nx: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@agentxm/*"
  - "@effect/tsgo@0.48.1"
  - "@effect/tsgo-darwin-arm64@0.48.1"
  - "@effect/tsgo-darwin-x64@0.48.1"
  - "@effect/tsgo-linux-arm64@0.48.1"
  - "@effect/tsgo-linux-arm@0.48.1"
  - "@effect/tsgo-linux-x64@0.48.1"
  - "@effect/tsgo-win32-arm64@0.48.1"
  - "@effect/tsgo-win32-x64@0.48.1"
  - "@typescript-eslint/eslint-plugin@8.71.1"
  - "@typescript-eslint/parser@8.71.1"
  - "@typescript-eslint/project-service@8.71.1"
  - "@typescript-eslint/scope-manager@8.71.1"
  - "@typescript-eslint/tsconfig-utils@8.71.1"
  - "@typescript-eslint/type-utils@8.71.1"
  - "@typescript-eslint/types@8.71.1"
  - "@typescript-eslint/typescript-estree@8.71.1"
  - "@typescript-eslint/utils@8.71.1"
  - "@typescript-eslint/visitor-keys@8.71.1"
  - "typescript-eslint@8.71.1"
  - "@effect/openapi-generator@4.0.1"
  - "@effect/platform-node-shared@4.0.1"
  - "@effect/platform-node@4.0.1"
  - "@effect/vitest@4.0.1"
  - "@fast-check/vitest@0.5.0"
  - axm.sh
  - effect@4.0.1

overrides:
  # Compatible type consumers share the declared Node/Bun tooling cohort.
  "@types/node@": "catalog:"
  "@babel/plugin-transform-modules-systemjs@<7.29.4": 7.29.4
  adm-zip@<0.6.1: 0.6.1
  axios@<1.18.0: 1.18.0
  brace-expansion@>=1.0.0 <1.1.18: 1.1.18
  brace-expansion@>=2.0.0 <2.1.4: 2.1.4
  brace-expansion@>=5.0.0 <5.0.11: 5.0.11
  flatted@<3.4.2: 3.4.2
  js-yaml@>=3.0.0 <3.15.1: 3.15.1
  picomatch@>=4.0.0 <4.0.5: 4.0.5
  postcss@>=8.0.0 <8.5.23: 8.5.23
  nanoid@<3.3.18: 3.3.18
  qs@>=6.11.1 <6.16.0: 6.16.0
  smol-toml@<=1.7.0: 1.7.1
  undici@>=8.0.0 <8.9.0: 8.9.0
