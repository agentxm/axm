[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentxm-example-pawmatch"
version = "0.1.0"
description = "Tiny community pet-adoption CLI demonstrating consumption of agentxm-example-tinyflags."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["pawmatch", "tinyflags", "agentxm", "example"]
dependencies = [
    "agentxm-example-tinyflags>=0.1.0",
    "typer>=0.12",
]

[project.scripts]
pawmatch = "agentxm_example_pawmatch.cli:app"

[dependency-groups]
test = ["pytest>=8"]

[tool.uv.sources]
agentxm-example-tinyflags = { path = "../pypi-python-lib", editable = true }

[tool.hatch.build]
directory = "artifacts"

[tool.hatch.build.targets.wheel]
packages = ["src/agentxm_example_pawmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP", "RUF", "SIM", "PT", "PERF"]

[tool.ruff.format]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
