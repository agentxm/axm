# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: augment
name: Augment
vendor: Augment Code
homepage: https://www.augmentcode.com
interfaces:
  - ide-extension
  - cli
docs:
  - label: Augment documentation
    url: https://docs.augmentcode.com
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .augment/rules
  sources:
    - https://docs.augmentcode.com/cli/skills
  lastVerified: 2026-05-20
commands:
  notes: No industry spec for slash commands yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  directory: .augment/commands
  sources:
    - https://docs.augmentcode.com/cli/slash-commands
  lastVerified: 2026-05-20
subagents:
  notes: No industry spec for subagents yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://docs.augmentcode.com/cli/subagents
  lastVerified: 2026-05-20
  directory: .augment/agents
  layout: directory
instructions:
  standardsCompliance: full
  convention: universal
  scopes:
    - project
  files:
    - AGENTS.md
  nestedDiscovery: true
  sources:
    - https://docs.augmentcode.com/cli/context
  lastVerified: 2026-05-20
  kind: agents-md
rootDir: .augment
