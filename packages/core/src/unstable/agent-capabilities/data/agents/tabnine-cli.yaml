# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: tabnine-cli
name: Tabnine CLI
vendor: Tabnine
homepage: https://www.tabnine.com/platform-cli/
interfaces:
  - cli
rootDir: .tabnine
detection:
  projectDirs:
    - .tabnine
  userDirs:
    - ~/.tabnine
docs:
  - label: Tabnine CLI
    url: https://www.tabnine.com/platform-cli/
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  directory: .tabnine/agent/skills
  sources:
    - https://github.com/vercel-labs/skills/blob/main/src/agents.ts
  lastVerified: 2026-05-20
commands:
  notes: No industry spec for slash commands yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  directory: .tabnine/agent/commands
  sources:
    - https://docs.tabnine.com/main/getting-started/tabnine-cli/features/commands
  lastVerified: 2026-05-20
