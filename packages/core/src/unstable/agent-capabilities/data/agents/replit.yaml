# yaml-language-server: $schema=../../agent.schema.json
id: replit
name: Replit
vendor: Replit
homepage: https://replit.com
interfaces:
  - ide-extension
docs:
  - label: Replit Agent documentation
    url: https://docs.replit.com/replitai/agent
skills:
  support: standard
  scopes:
    - project
  directory: .agents/skills
  sources:
    - https://docs.replit.com/replitai/agent/skills
  lastVerified: 2026-05-20
mcp:
  support: standard
  scopes:
    - project
  transports:
    - stdio
    - http
  config:
    serversKey: mcpServers
    nativeEnabled: true
    targets:
      - scope: project
        path: .replit/mcp.json
        format: json
    stdio:
      command: split
      envKey: env
    remote:
      typeField:
        name: type
        value:
          streamable-http: http
          sse: http
      urlKey:
        streamable-http: url
        sse: url
      headersKey: headers
  sources:
    - https://docs.replit.com/replitai/agent/mcp
  lastVerified: 2026-05-20
rootDir: null
