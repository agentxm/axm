# yaml-language-server: $schema=../../agent.schema.json
id: rovodev
name: Rovo Dev
vendor: Atlassian
homepage: https://www.atlassian.com/software/rovo-dev
interfaces:
  - cli
rootDir: .rovodev
detection:
  projectDirs:
    - .rovodev
  userDirs:
    - ~/.rovodev
docs:
  - label: Rovo Dev CLI skills
    url: https://support.atlassian.com/rovo/docs/extend-rovo-dev-cli-with-agent-skills/
skills:
  support: standard
  scopes:
    - user
    - project
  directory: .rovodev/skills
  notes: >
    Rovo Dev also reads universal .agents/skills in both project and user scopes.
  sources:
    - https://support.atlassian.com/rovo/docs/extend-rovo-dev-cli-with-agent-skills/
    - https://github.com/vercel-labs/skills/blob/main/src/agents.ts
  lastVerified: 2026-05-20
subagents:
  support: bridged
  scopes:
    - user
    - project
  directory: .rovodev/agents
  layout: directory
  sources:
    - https://support.atlassian.com/rovo/docs/use-subagents-in-rovo-dev-cli/
  lastVerified: 2026-05-20
