# yaml-language-server: $schema=../../__generated__/agent.schema.json
id: junie
name: Junie
vendor: JetBrains
homepage: https://www.jetbrains.com/junie
interfaces:
  - ide-extension
family: jetbrains
docs:
  - label: Junie documentation
    url: https://www.jetbrains.com/help/junie
rules:
  notes: No industry spec for rule files yet; AXM bridges to the agent's native layout.
  scopes:
    - project
  directory: .junie/guidelines.md
  sources:
    - https://www.jetbrains.com/help/junie/customize-guidelines.html
  lastVerified: 2026-05-20
mcp:
  standardsCompliance: full
  convention: universal
  scopes:
    - user
  transports:
    - stdio
    - http
    - sse
  config:
    serversKey: mcpServers
    nativeEnabled: true
    targets:
      - scope: user
        path: ~/.junie/mcp.json
        format: json
    stdio:
      command: split
      envKey: env
    remote:
      typeField:
        name: type
        value:
          streamable-http: http
          sse: sse
      urlKey:
        streamable-http: url
        sse: url
      headersKey: headers
  sources:
    - https://www.jetbrains.com/help/junie/mcp.html
  lastVerified: 2026-05-20
rootDir: .junie
skills:
  standardsCompliance: full
  convention: vendor
  scopes:
    - user
    - project
  sources:
    - https://www.jetbrains.com/help/junie
  lastVerified: 2026-05-20
  directory: .junie/skills
commands:
  notes: No industry spec for slash commands yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://www.jetbrains.com/help/junie
  lastVerified: 2026-05-20
  directory: .junie/commands
subagents:
  notes: No industry spec for subagents yet; AXM bridges to the agent's native layout.
  scopes:
    - user
    - project
  sources:
    - https://www.jetbrains.com/help/junie
  lastVerified: 2026-05-20
  directory: .junie/agents
  layout: directory
